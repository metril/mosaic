networks:
  screensaver:
    name: screensaver
    driver: bridge

services:
  screensaver:
    build: .
    container_name: screensaver
    restart: unless-stopped
    networks:
      - screensaver
    ports:
      - 80:80
    volumes:
      - /mnt/usb-storage-1/images:/www/images:ro
    env_file:
      - .env
    environment:
      - BASE_URL=${BASE_URL:-}
