networks:
  screensaver:
    name: screensaver
    driver: bridge

services:
  screensaver:
    build: .
    container_name: screensaver
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    networks:
      - screensaver
    ports:
      - 80:80
    volumes:
      - /mnt/usb-storage-1/images:/www/images:ro
      - /mnt/usb-storage-1/cache:/www/cache
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - BASE_URL=${BASE_URL:-}
    # Resource limits for stability
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2
    # Log rotation to prevent disk fill
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
