networks:
  mosaic:
    name: mosaic
    driver: bridge

services:
  mosaic:
    image: ghcr.io/metril/mosaic:latest
    build: .
    container_name: mosaic
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    networks:
      - mosaic
    ports:
      - 80:80
    volumes:
      - /mnt/usb-storage-1/mosaic/images:/www/images
      - /mnt/usb-storage-1/mosaic/thumbnails:/www/thumbnails
      - ./config:/app/config
    env_file:
      - .env
    # Resource limits for stability
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 2
    # Log rotation to prevent disk fill
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
