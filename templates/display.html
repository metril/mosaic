<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <!-- External CSS files for overlay themes (Immich Kiosk architecture) -->
        <link rel="stylesheet" href="/css/vars.css">
        <link rel="stylesheet" href="/css/overlays.css">
        <link rel="stylesheet" href="/css/themes/theme-fade.css">
        <link rel="stylesheet" href="/css/themes/theme-solid.css">
        <link rel="stylesheet" href="/css/themes/theme-bubble.css">
        <link rel="stylesheet" href="/css/themes/theme-blur.css">
        <!-- date-fns for robust date formatting (same as Immich Kiosk) -->
        <script src="/js/date-fns.min.js"></script>
        <title>Sync - {{ group_id }}</title>
        <style type="text/css">
            /* CSS Variables and overlay styles are in external files */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html {
                overflow: hidden;
                overscroll-behavior: none;
                height: 100%;
                width: 100%;
            }
            body {
                background-color: rgb(0, 0, 0);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                width: 100vw;
                overflow: hidden;
                overscroll-behavior: none;
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
            }
            .image-container {
                position: relative;
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .screensaver-image {
                border: none;
                max-height: 100vh;
                max-width: 100vw;
                height: 100%;
                width: 100%;
                object-fit: contain;
                position: absolute;
                top: 0;
                left: 0;
                z-index: 1;
            }
            .hidden {
                opacity: 0;
                pointer-events: none;
            }
            .visible {
                opacity: 1;
            }
            /* Smooth transition for image swaps */
            .fade-transition {
                transition: opacity 0.3s ease-in-out;
            }
            /* Connection status indicator */
            .status-indicator {
                position: fixed;
                top: 10px;
                right: 10px;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background-color: #888;
                z-index: 1000;
                transition: opacity 0.5s ease-out;
            }
            .status-indicator.hidden {
                opacity: 0;
                pointer-events: none;
            }
            .status-indicator.connected {
                background-color: #4caf50;
            }
            .status-indicator.disconnected {
                background-color: #f44336;
            }
            .status-indicator.connecting {
                background-color: #ff9800;
                animation: pulse 1s infinite;
            }
            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
            }
            /* Debug overlay */
            .debug-overlay {
                position: fixed;
                bottom: 10px;
                left: 10px;
                background: rgba(0, 0, 0, 0.8);
                color: #0f0;
                font-family: monospace;
                font-size: 12px;
                padding: 10px;
                border-radius: 5px;
                z-index: 1000;
                max-width: 400px;
                display: none;
            }
            .debug-overlay.visible {
                display: block;
            }

            /* =================================================================
               Background Blur Layer
               ================================================================= */
            .frame--background {
                position: absolute;
                top: -5%;
                left: -5%;
                width: 110%;
                height: 110%;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                z-index: 0;
                transition: background-image 0.5s ease-in-out;
            }
            /* =================================================================
               Layout Styles
               ================================================================= */
            /* Single layout (default) */
            .layout-single {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .frame--layout-single {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }

            /* Split view - side by side */
            .layout-splitview {
                display: flex;
                flex-direction: row;
            }
            .layout-splitview .frame {
                width: 50%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow: hidden;
            }
            .layout-splitview .frame .screensaver-image {
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                position: relative;
            }

            /* Split view landscape - stacked vertically */
            .layout-splitview-landscape {
                display: flex;
                flex-direction: column;
            }
            .layout-splitview-landscape .frame {
                width: 100%;
                height: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow: hidden;
            }
            .layout-splitview-landscape .frame .screensaver-image {
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                position: relative;
            }

            /* Responsive adjustments */
            @media (orientation: portrait) {
                .layout-splitview {
                    flex-direction: column;
                }
                .layout-splitview .frame {
                    width: 100%;
                    height: 50%;
                }
            }
            @media (orientation: landscape) {
                .layout-splitview-landscape {
                    flex-direction: row;
                }
                .layout-splitview-landscape .frame {
                    width: 50%;
                    height: 100%;
                }
            }

            /* Overlay styles are in external CSS files (/css/*.css) */

            /* Image fit modes */
            .screensaver-image.fit-cover {
                object-fit: cover;
            }
            .screensaver-image.fit-contain {
                object-fit: contain;
            }

            .debug-overlay dt {
                color: #888;
                float: left;
                clear: left;
                width: 100px;
            }
            .debug-overlay dd {
                margin-left: 110px;
            }
        </style>
    </head>
    <body>
        <div class="status-indicator connecting" id="statusIndicator"></div>

        <div class="image-container layout-{{ settings.layout|default('single') }}" id="imageContainer">
            <!-- Background blur layer -->
            <div class="frame--background hidden" id="backgroundBlur"></div>

            <!-- Frame 1 (primary) -->
            <div class="frame frame--layout-{{ settings.layout|default('single') }}" id="frame1">
                <img id="currentImage" class="screensaver-image visible fit-{{ settings.image_fit|default('contain') }}" src="" alt="Screensaver">
                <img id="preloadImage" class="screensaver-image hidden fit-{{ settings.image_fit|default('contain') }}" src="" alt="Preload">
            </div>

            <!-- Frame 2 (for split views) -->
            <div class="frame frame--layout-{{ settings.layout|default('single') }}" id="frame2" style="display: none;">
                <img id="currentImage2" class="screensaver-image visible fit-{{ settings.image_fit|default('contain') }}" src="" alt="Screensaver 2">
                <img id="preloadImage2" class="screensaver-image hidden fit-{{ settings.image_fit|default('contain') }}" src="" alt="Preload 2">
            </div>
        </div>

        <!-- Overlay container - single fixed element for kiosk browser compatibility -->
        <div class="overlay-container" id="overlayContainer">
            <!-- Gradient backdrop elements (siblings of overlays, not affected by pixel shift transforms) -->
            <div class="gradient-backdrop clock-gradient clock-gradient--theme-{{ settings.overlay_theme|default('fade') }} hidden" id="clockGradient"></div>
            <div class="gradient-backdrop weather-gradient weather-gradient--theme-{{ settings.overlay_theme|default('fade') }} hidden" id="weatherGradient"></div>

            <!-- Clock overlay -->
            <div class="overlay clock-overlay clock--theme-{{ settings.overlay_theme|default('fade') }} position-{{ settings.clock_position|default('bottom-left') }} hidden" id="clockOverlay">
                <div class="clock-time" id="clockTime"></div>
                <div class="clock-date" id="clockDate"></div>
            </div>

            <!-- Weather overlay -->
            <div class="overlay weather-overlay weather--theme-{{ settings.overlay_theme|default('fade') }} position-{{ settings.weather_position|default('bottom-right') }} hidden" id="weatherOverlay">
                <div class="weather-icon" id="weatherIcon"></div>
                <div class="weather-temp" id="weatherTemp"></div>
                <div class="weather-condition" id="weatherCondition"></div>
                <div class="weather-forecast" id="weatherForecast"></div>
            </div>
        </div>

        <div class="debug-overlay" id="debugOverlay">
            <dl>
                <dt>Browser ID:</dt>
                <dd id="debugBrowserId">-</dd>
                <dt>Group:</dt>
                <dd id="debugGroup">{{ group_id }}</dd>
                <dt>Status:</dt>
                <dd id="debugStatus">connecting</dd>
                <dt>Cycle:</dt>
                <dd id="debugCycle">0</dd>
                <dt>Next switch:</dt>
                <dd id="debugNextSwitch">-</dd>
                <dt>Current:</dt>
                <dd id="debugCurrentImage">-</dd>
                <dt>Preload:</dt>
                <dd id="debugPreloadImage">-</dd>
                <dt>Browsers:</dt>
                <dd id="debugBrowserCount">0</dd>
            </dl>
        </div>

        <script type="text/javascript">
            // =================================================================
            // Settings from server (passed via template)
            // =================================================================
            const SETTINGS = {
                show_time: {{ settings.show_time|default(false)|tojson }},
                show_date: {{ settings.show_date|default(false)|tojson }},
                time_format: "{{ settings.time_format|default('24') }}",
                date_format: "{{ settings.date_format|default('%A, %B %d') }}",
                clock_source: "{{ settings.clock_source|default('client') }}",
                clock_position: "{{ settings.clock_position|default('bottom-left') }}",
                overlay_theme: "{{ settings.overlay_theme|default('fade') }}",
                show_weather: {{ settings.show_weather|default(false)|tojson }},
                weather_position: "{{ settings.weather_position|default('bottom-right') }}",
                weather_ha_entity: "{{ settings.weather_ha_entity|default('') }}",
                weather_show_forecast: {{ settings.weather_show_forecast|default(false)|tojson }},
                weather_forecast_type: "{{ settings.weather_forecast_type|default('daily') }}",
                weather_forecast_days: {{ settings.weather_forecast_days|default(3) }},
                weather_show_high_low: {{ settings.weather_show_high_low|default(true)|tojson }},
                weather_show_precipitation: {{ settings.weather_show_precipitation|default(false)|tojson }},
                layout: "{{ settings.layout|default('single') }}",
                background_blur: {{ settings.background_blur|default(false)|tojson }},
                background_blur_amount: {{ settings.background_blur_amount|default(50) }},
                image_fit: "{{ settings.image_fit|default('contain') }}",
                // Burn-in prevention settings
                burn_in_protection: {{ settings.burn_in_protection|default(false)|tojson }},
                burn_in_interval: {{ settings.burn_in_interval|default(5) }},
                burn_in_duration: {{ settings.burn_in_duration|default(30) }},
                burn_in_opacity: {{ settings.burn_in_opacity|default(70) }},
                burn_in_shift_enabled: {{ settings.burn_in_shift_enabled|default(true)|tojson }},
                burn_in_shift_amount: {{ settings.burn_in_shift_amount|default(5) }},
                burn_in_shift_interval: {{ settings.burn_in_shift_interval|default(60) }}
            };

            // =================================================================
            // Clock Class - Real-time time display with offset-based server sync
            // =================================================================
            class Clock {
                constructor(settings) {
                    this.settings = settings;
                    this.timeEl = document.getElementById('clockTime');
                    this.dateEl = document.getElementById('clockDate');
                    this.overlay = document.getElementById('clockOverlay');
                    this.gradient = document.getElementById('clockGradient');
                    this.updateInterval = null;
                    this.syncInterval = null;
                    this.serverOffset = 0; // Offset between server and client time (ms)
                }

                start() {
                    if (!this.settings.show_time && !this.settings.show_date) {
                        this.overlay.classList.add('hidden');
                        this.gradient.classList.add('hidden');
                        return;
                    }

                    this.overlay.classList.remove('hidden');
                    this.overlay.className = 'overlay clock-overlay clock--theme-' + this.settings.overlay_theme + ' position-' + this.settings.clock_position;
                    this.gradient.classList.remove('hidden');
                    this.gradient.className = 'gradient-backdrop clock-gradient clock-gradient--theme-' + this.settings.overlay_theme;

                    // Initial sync if using server time
                    if (this.settings.clock_source !== 'client') {
                        this.syncWithServer();
                        // Re-sync every 15 seconds
                        this.syncInterval = setInterval(() => this.syncWithServer(), 15000);
                    }

                    // Update display every second for smooth updates
                    this.render();
                    this.updateInterval = setInterval(() => this.render(), 1000);
                }

                async syncWithServer() {
                    try {
                        const clientBefore = Date.now();
                        const response = await fetch('/api/clock?source=' + this.settings.clock_source);
                        const clientAfter = Date.now();
                        const data = await response.json();

                        if (data.datetime) {
                            const serverTime = new Date(data.datetime).getTime();
                            // Account for network latency (use midpoint)
                            const clientMidpoint = (clientBefore + clientAfter) / 2;
                            this.serverOffset = serverTime - clientMidpoint;
                            console.log('Clock synced, offset:', this.serverOffset, 'ms');
                        }
                    } catch (e) {
                        console.error('Failed to sync clock:', e);
                        // Keep using last offset or 0
                    }
                }

                getCurrentTime() {
                    if (this.settings.clock_source === 'client') {
                        return new Date();
                    }
                    // Apply server offset for accurate time
                    return new Date(Date.now() + this.serverOffset);
                }

                render() {
                    const now = this.getCurrentTime();

                    if (this.settings.show_time) {
                        this.timeEl.textContent = this.formatTime(now);
                        this.timeEl.style.display = 'block';
                    } else {
                        this.timeEl.style.display = 'none';
                    }

                    if (this.settings.show_date) {
                        this.dateEl.textContent = this.formatDate(now);
                        this.dateEl.style.display = 'block';
                    } else {
                        this.dateEl.style.display = 'none';
                    }
                }

                formatTime(date) {
                    const options = {
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: this.settings.time_format === '12'
                    };
                    return date.toLocaleTimeString(undefined, options);
                }

                formatDate(date) {
                    // Convert Immich Kiosk tokens to date-fns tokens
                    const format = this.settings.date_format || 'DDDD, MMMM DD';
                    const dateFnsFormat = format
                        .replace(/DDDD/g, 'eeee')    // full weekday
                        .replace(/DDD/g, 'eee')      // abbreviated weekday
                        .replace(/DD/g, 'dd')        // day of month, 2 digits
                        .replace(/D/g, 'd')          // day of month
                        .replace(/YYYY/g, 'yyyy')    // 4-digit year
                        .replace(/YY/g, 'yy');       // 2-digit year
                    // MMMM, MMM, MM, M stay the same in date-fns

                    return dateFns.format(date, dateFnsFormat);
                }

                stop() {
                    if (this.updateInterval) {
                        clearInterval(this.updateInterval);
                        this.updateInterval = null;
                    }
                    if (this.syncInterval) {
                        clearInterval(this.syncInterval);
                        this.syncInterval = null;
                    }
                }

                updateSettings(newSettings) {
                    this.stop();
                    this.settings = { ...this.settings, ...newSettings };
                    this.start();
                }
            }

            // =================================================================
            // Weather Class - Weather display from Home Assistant
            // =================================================================
            class Weather {
                constructor(settings) {
                    this.settings = settings;
                    this.overlay = document.getElementById('weatherOverlay');
                    this.gradient = document.getElementById('weatherGradient');
                    this.updateInterval = null;
                }

                start() {
                    if (!this.settings.show_weather || !this.settings.weather_ha_entity) {
                        this.overlay.classList.add('hidden');
                        this.gradient.classList.add('hidden');
                        return;
                    }

                    this.overlay.classList.remove('hidden');
                    this.overlay.className = 'overlay weather-overlay weather--theme-' + this.settings.overlay_theme + ' position-' + this.settings.weather_position;
                    this.gradient.classList.remove('hidden');
                    this.gradient.className = 'gradient-backdrop weather-gradient weather-gradient--theme-' + this.settings.overlay_theme;

                    // Update immediately
                    this.update();

                    // Update every 10 minutes
                    this.updateInterval = setInterval(() => this.update(), 600000);
                }

                async update() {
                    try {
                        // Fetch current conditions
                        const response = await fetch(
                            '/api/weather?entity_id=' + encodeURIComponent(this.settings.weather_ha_entity)
                        );
                        if (!response.ok) {
                            console.error('Weather fetch failed:', response.status);
                            return;
                        }
                        const data = await response.json();

                        // Fetch forecast separately if enabled
                        let forecastData = null;
                        if (this.settings.weather_show_forecast) {
                            try {
                                const forecastType = this.settings.weather_forecast_type || 'daily';
                                const forecastDays = this.settings.weather_forecast_days || 3;
                                const forecastUrl = '/api/weather/forecast?entity_id=' +
                                    encodeURIComponent(this.settings.weather_ha_entity) +
                                    '&forecast_type=' + forecastType +
                                    '&limit=' + forecastDays;
                                const forecastResponse = await fetch(forecastUrl);
                                if (forecastResponse.ok) {
                                    forecastData = await forecastResponse.json();
                                }
                            } catch (e) {
                                console.error('Failed to fetch forecast:', e);
                            }
                        }

                        this.render(data, forecastData);
                    } catch (e) {
                        console.error('Failed to fetch weather:', e);
                    }
                }

                render(data, forecastData) {
                    document.getElementById('weatherIcon').textContent = this.getWeatherIcon(data.condition);
                    document.getElementById('weatherTemp').textContent =
                        Math.round(data.temperature) + (data.temperature_unit || '°');
                    document.getElementById('weatherCondition').textContent =
                        data.condition ? data.condition.replace(/-/g, ' ') : '';

                    const forecastEl = document.getElementById('weatherForecast');
                    if (this.settings.weather_show_forecast && forecastData && forecastData.forecast && forecastData.forecast.length > 0) {
                        const isHourly = this.settings.weather_forecast_type === 'hourly';
                        const showHighLow = this.settings.weather_show_high_low ?? true;
                        const showPrecip = this.settings.weather_show_precipitation || false;

                        forecastEl.innerHTML = forecastData.forecast.map(f => {
                            const date = new Date(f.datetime);
                            // Label: time for hourly, day name for daily
                            const label = isHourly
                                ? date.toLocaleTimeString(undefined, { hour: 'numeric' })
                                : date.toLocaleDateString(undefined, { weekday: 'short' });

                            // Temperature display
                            let tempDisplay = Math.round(f.temperature) + '°';
                            if (showHighLow && f.templow != null && !isHourly) {
                                tempDisplay = Math.round(f.temperature) + '°/' + Math.round(f.templow) + '°';
                            }

                            // Precipitation display
                            let precipHtml = '';
                            if (showPrecip && f.precipitation_probability != null) {
                                precipHtml = '<span class="precip">💧' + f.precipitation_probability + '%</span>';
                            }

                            return '<div class="forecast-day">' +
                                '<span class="forecast-label">' + label + '</span>' +
                                '<span class="forecast-icon">' + this.getWeatherIcon(f.condition) + '</span>' +
                                '<span class="forecast-temp">' + tempDisplay + '</span>' +
                                precipHtml +
                            '</div>';
                        }).join('');
                        forecastEl.style.display = 'flex';
                    } else {
                        forecastEl.style.display = 'none';
                    }
                }

                getWeatherIcon(condition) {
                    if (!condition) return '🌡️';
                    const c = condition.toLowerCase();
                    if (c.includes('sunny') || c.includes('clear')) return c.includes('night') ? '🌙' : '☀️';
                    if (c.includes('cloud') || c.includes('overcast')) return c.includes('partly') ? '⛅' : '☁️';
                    if (c.includes('rain') || c.includes('drizzle') || c.includes('shower')) return '🌧️';
                    if (c.includes('snow') || c.includes('sleet') || c.includes('hail')) return '❄️';
                    if (c.includes('thunder') || c.includes('lightning')) return '⚡';
                    if (c.includes('fog') || c.includes('mist') || c.includes('haze')) return '🌫️';
                    if (c.includes('wind')) return '💨';
                    return '🌡️';
                }

                stop() {
                    if (this.updateInterval) {
                        clearInterval(this.updateInterval);
                        this.updateInterval = null;
                    }
                }

                updateSettings(newSettings) {
                    this.stop();
                    this.settings = { ...this.settings, ...newSettings };
                    this.start();
                }
            }

            // =================================================================
            // BackgroundBlur Class - Manages blurred background layer
            // =================================================================
            class BackgroundBlur {
                constructor(settings) {
                    this.settings = settings;
                    this.backgroundEl = document.getElementById('backgroundBlur');
                    this.enabled = settings.background_blur && settings.image_fit !== 'cover';
                }

                update(blurDataUrl) {
                    if (!this.enabled || !blurDataUrl) {
                        this.backgroundEl.classList.add('hidden');
                        return;
                    }

                    this.backgroundEl.style.backgroundImage = 'url(' + blurDataUrl + ')';
                    this.backgroundEl.classList.remove('hidden');
                }

                clear() {
                    this.backgroundEl.classList.add('hidden');
                    this.backgroundEl.style.backgroundImage = '';
                }

                updateSettings(newSettings) {
                    this.settings = { ...this.settings, ...newSettings };
                    this.enabled = this.settings.background_blur && this.settings.image_fit !== 'cover';
                    if (!this.enabled) {
                        this.clear();
                    }
                }
            }

            // =================================================================
            // BurnInManager - Prevents screen burn-in on OLED displays
            // =================================================================
            var burnInManager = {
                enabled: false,
                // Dimming settings
                dimInterval: 5,       // minutes
                dimDuration: 30,      // seconds
                dimOpacity: 70,       // percentage
                dimTimer: null,
                // Shift settings
                shiftEnabled: true,
                shiftAmount: 5,       // pixels
                shiftInterval: 60,    // seconds
                shiftTimer: null,
                currentShiftX: 0,
                currentShiftY: 0,

                init: function(settings) {
                    this.stop();  // Clear existing timers

                    this.enabled = settings.burn_in_protection || false;
                    this.dimInterval = settings.burn_in_interval || 5;
                    this.dimDuration = settings.burn_in_duration || 30;
                    this.dimOpacity = settings.burn_in_opacity || 70;
                    this.shiftEnabled = settings.burn_in_shift_enabled !== false;
                    this.shiftAmount = settings.burn_in_shift_amount || 5;
                    this.shiftInterval = settings.burn_in_shift_interval || 60;

                    console.log('Burn-in protection:', this.enabled, 'shift:', this.shiftEnabled);

                    if (this.enabled) {
                        this.startDimming();
                        if (this.shiftEnabled) {
                            this.shiftCycle();  // Run first shift immediately
                            this.startShifting();
                        }
                    }
                },

                startDimming: function() {
                    this.dimTimer = setInterval(this.dimCycle.bind(this), this.dimInterval * 60 * 1000);
                },

                dimCycle: function() {
                    var overlays = document.querySelectorAll('.overlay');
                    var self = this;
                    // Dim overlays
                    overlays.forEach(function(el) {
                        el.style.transition = 'opacity 1s ease';
                        el.style.opacity = self.dimOpacity / 100;
                    });
                    // Restore after duration
                    setTimeout(function() {
                        overlays.forEach(function(el) {
                            el.style.opacity = '1';
                        });
                    }, this.dimDuration * 1000);
                },

                startShifting: function() {
                    this.shiftTimer = setInterval(this.shiftCycle.bind(this), this.shiftInterval * 1000);
                },

                shiftCycle: function() {
                    var overlays = document.querySelectorAll('.overlay');
                    var self = this;

                    overlays.forEach(function(el) {
                        // Generate random shift magnitudes [0, amount]
                        var randX = Math.floor(Math.random() * (self.shiftAmount + 1));
                        var randY = Math.floor(Math.random() * (self.shiftAmount + 1));

                        var shiftX = 0, shiftY = 0;

                        // Apply direction based on position to shift INWARD only (away from edges)
                        if (el.classList.contains('position-bottom-left')) {
                            shiftX = randX;      // Move right (away from left edge)
                            shiftY = -randY;     // Move up (away from bottom edge)
                        } else if (el.classList.contains('position-bottom-right')) {
                            shiftX = -randX;     // Move left (away from right edge)
                            shiftY = -randY;     // Move up (away from bottom edge)
                        } else if (el.classList.contains('position-top-left')) {
                            shiftX = randX;      // Move right (away from left edge)
                            shiftY = randY;      // Move down (away from top edge)
                        } else if (el.classList.contains('position-top-right')) {
                            shiftX = -randX;     // Move left (away from right edge)
                            shiftY = randY;      // Move down (away from top edge)
                        }

                        el.style.transition = 'transform 0.5s ease';
                        el.style.transform = 'translate(' + shiftX + 'px, ' + shiftY + 'px)';
                    });
                },

                stop: function() {
                    if (this.dimTimer) {
                        clearInterval(this.dimTimer);
                        this.dimTimer = null;
                    }
                    if (this.shiftTimer) {
                        clearInterval(this.shiftTimer);
                        this.shiftTimer = null;
                    }
                    // Reset shifts and opacity
                    var overlays = document.querySelectorAll('.overlay');
                    overlays.forEach(function(el) {
                        el.style.transform = '';
                        el.style.opacity = '1';
                    });
                }
            };

            // =================================================================
            // LayoutManager Class - Manages display layouts
            // =================================================================
            class LayoutManager {
                constructor(settings) {
                    this.settings = settings;
                    this.container = document.getElementById('imageContainer');
                    this.frame1 = document.getElementById('frame1');
                    this.frame2 = document.getElementById('frame2');
                }

                initialize() {
                    const layout = this.settings.layout || 'single';

                    // Set container class
                    this.container.className = 'image-container layout-' + layout;

                    // Set frame classes
                    this.frame1.className = 'frame frame--layout-' + layout;
                    this.frame2.className = 'frame frame--layout-' + layout;

                    // Show/hide second frame based on layout
                    if (layout !== 'single') {
                        this.frame2.style.display = 'flex';
                    } else {
                        this.frame2.style.display = 'none';
                    }
                }

                getFrameCount() {
                    return this.settings.layout === 'single' ? 1 : 2;
                }

                updateSettings(newSettings) {
                    this.settings = { ...this.settings, ...newSettings };
                    this.initialize();
                }
            }

            // =================================================================
            // Initialize overlay features
            // =================================================================
            const clockManager = new Clock(SETTINGS);
            const weatherManager = new Weather(SETTINGS);
            const blurManager = new BackgroundBlur(SETTINGS);
            const layoutManager = new LayoutManager(SETTINGS);

            // Start features on page load
            document.addEventListener('DOMContentLoaded', function() {
                layoutManager.initialize();
                clockManager.start();
                weatherManager.start();
                burnInManager.init(SETTINGS);
            });

            // Prevent scrolling on kiosk browsers (Fully Kiosk, Android WebView)
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            window.addEventListener('scroll', function() {
                window.scrollTo(0, 0);
            }, true);

            window.scrollTo(0, 0);

            (function() {
                // Configuration
                const WS_URL = "{{ ws_url }}";
                const HEARTBEAT_INTERVAL = 30000; // 30 seconds
                const RECONNECT_BASE_DELAY = 1000;
                const RECONNECT_MAX_DELAY = 30000;
                const IMAGE_RETRY_MAX = 3; // Max image load retries (#12)

                // Centralized timer tracking (#19-21)
                const timers = {
                    heartbeat: null,
                    reconnect: null,
                    switch: null,
                    switchAnimation: null,
                    debugUpdate: null,
                    statusHide: null
                };

                // State
                let ws = null;
                let browserId = null;
                let currentCycle = 0;
                let reconnectAttempts = 0;
                let debugVisible = false;
                let nextSwitchTime = null;
                let imageRetryCount = 0; // Track retries per image (#12)

                // DOM elements
                const statusIndicator = document.getElementById('statusIndicator');
                let currentImage = document.getElementById('currentImage');
                let preloadImage = document.getElementById('preloadImage');
                const debugOverlay = document.getElementById('debugOverlay');

                // Clear all timers (#19-21)
                function clearAllTimers() {
                    Object.keys(timers).forEach(function(key) {
                        if (timers[key]) {
                            if (key === 'heartbeat' || key === 'debugUpdate') {
                                clearInterval(timers[key]);
                            } else {
                                clearTimeout(timers[key]);
                            }
                            timers[key] = null;
                        }
                    });
                }

                // Debug functions
                function updateDebug(field, value) {
                    const el = document.getElementById('debug' + field);
                    if (el) el.textContent = value;
                }

                function toggleDebug() {
                    debugVisible = !debugVisible;
                    debugOverlay.classList.toggle('visible', debugVisible);
                }

                // Keyboard handler for debug toggle
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'd' || e.key === 'D') {
                        toggleDebug();
                    }
                });

                // Status indicator
                function setStatus(status) {
                    // Clear any pending hide timer
                    if (timers.statusHide) {
                        clearTimeout(timers.statusHide);
                        timers.statusHide = null;
                    }

                    // Show indicator and set status
                    statusIndicator.classList.remove('hidden');
                    statusIndicator.className = 'status-indicator ' + status;
                    updateDebug('Status', status);

                    // Auto-hide after 3 seconds when connected
                    if (status === 'connected') {
                        timers.statusHide = setTimeout(function() {
                            statusIndicator.classList.add('hidden');
                            timers.statusHide = null;
                        }, 3000);
                    }
                }

                // Reset state on reconnect (#29)
                function resetState() {
                    browserId = null;
                    currentCycle = 0;
                    nextSwitchTime = null;
                    imageRetryCount = 0;
                    updateDebug('BrowserId', '-');
                    updateDebug('Cycle', '0');
                    updateDebug('NextSwitch', '-');
                    updateDebug('CurrentImage', '-');
                    updateDebug('PreloadImage', '-');
                }

                // WebSocket connection
                function connect() {
                    // Cancel any pending reconnect (#6, #15)
                    if (timers.reconnect) {
                        clearTimeout(timers.reconnect);
                        timers.reconnect = null;
                    }

                    // Close existing connection if any
                    if (ws && ws.readyState !== WebSocket.CLOSED) {
                        ws.close();
                    }

                    setStatus('connecting');
                    console.log('Connecting to', WS_URL);

                    try {
                        ws = new WebSocket(WS_URL);
                    } catch (e) {
                        console.error('WebSocket creation failed:', e);
                        scheduleReconnect();
                        return;
                    }

                    ws.onopen = function() {
                        console.log('WebSocket connected');
                        setStatus('connected');
                        reconnectAttempts = 0;
                        startHeartbeat();
                    };

                    ws.onclose = function(event) {
                        console.log('WebSocket closed:', event.code, event.reason);
                        setStatus('disconnected');
                        stopHeartbeat();

                        if (event.code === 4004) {
                            // Group not found - don't reconnect
                            alert('Sync group not found. Please create it via /admin first.');
                        } else {
                            scheduleReconnect();
                        }
                    };

                    ws.onerror = function(error) {
                        console.error('WebSocket error:', error);
                    };

                    ws.onmessage = function(event) {
                        try {
                            const msg = JSON.parse(event.data);
                            handleMessage(msg);
                        } catch (e) {
                            console.error('Failed to parse message:', e);
                        }
                    };
                }

                function scheduleReconnect() {
                    // Clear any existing reconnect timer (#6, #15)
                    if (timers.reconnect) {
                        clearTimeout(timers.reconnect);
                    }

                    reconnectAttempts++;
                    const delay = Math.min(
                        RECONNECT_BASE_DELAY * Math.pow(2, reconnectAttempts - 1),
                        RECONNECT_MAX_DELAY
                    );
                    console.log('Reconnecting in', delay, 'ms (attempt', reconnectAttempts + ')');
                    timers.reconnect = setTimeout(connect, delay);
                }

                function startHeartbeat() {
                    stopHeartbeat();
                    timers.heartbeat = setInterval(function() {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'HEARTBEAT' }));
                        }
                    }, HEARTBEAT_INTERVAL);
                }

                function stopHeartbeat() {
                    if (timers.heartbeat) {
                        clearInterval(timers.heartbeat);
                        timers.heartbeat = null;
                    }
                }

                // Message handlers
                function handleMessage(msg) {
                    console.log('Received:', msg.type, msg);

                    switch (msg.type) {
                        case 'WELCOME':
                            handleWelcome(msg);
                            break;
                        case 'ASSIGN':
                            handleAssign(msg);
                            break;
                        case 'PRELOAD':
                            handlePreload(msg);
                            break;
                        case 'SWITCH':
                            handleSwitch(msg);
                            break;
                        case 'SETTINGS_CHANGED':
                            handleSettingsChanged(msg);
                            break;
                        case 'DISCONNECT':
                            handleDisconnect(msg);
                            break;
                        case 'NO_IMAGES':
                            handleNoImages(msg);
                            break;
                    }
                }

                function handleWelcome(msg) {
                    // Reset state on new connection (#29)
                    resetState();

                    // Clear error if images are now available
                    clearNoImagesError();

                    browserId = msg.browser_id;
                    updateDebug('BrowserId', browserId);
                    updateDebug('BrowserCount', msg.browser_count);
                    console.log('Joined as browser', browserId);
                }

                function handleAssign(msg) {
                    console.log('Assigned image:', msg.image_id);

                    // Clear error div - images are now available
                    clearNoImagesError();

                    currentCycle = msg.cycle;
                    imageRetryCount = 0; // Reset retry count for new image
                    updateDebug('Cycle', currentCycle);
                    updateDebug('CurrentImage', msg.image_id);

                    // Store blur_url for application after image loads
                    var blurUrl = (blurManager.enabled && msg.blur_url) ? msg.blur_url : null;

                    // Load image, then apply blur together so they appear in sync
                    loadImage(currentImage, msg.image_url, function() {
                        if (blurUrl) {
                            blurManager.update(blurUrl);
                        }
                        sendReady();
                    });
                }

                // Store pending blur URL for next image switch
                let pendingBlurUrl = null;
                // Track preload completion to prevent switching to unloaded images
                let preloadComplete = false;
                let switchPending = false;

                function handlePreload(msg) {
                    console.log('Preloading:', msg.image_id, 'switch at', msg.switch_at);

                    // Reset preload tracking for new image
                    preloadComplete = false;
                    switchPending = false;

                    // Clear error div - images are now available
                    clearNoImagesError();

                    nextSwitchTime = msg.switch_at;
                    imageRetryCount = 0; // Reset retry count for new image
                    updateDebug('PreloadImage', msg.image_id);

                    // Calculate time until switch
                    const now = Date.now();
                    const timeUntilSwitch = Math.max(0, msg.switch_at - now);
                    updateDebug('NextSwitch', Math.round(timeUntilSwitch / 1000) + 's');

                    // Store blur for switch (already a data URL from server, no fetch needed)
                    pendingBlurUrl = (blurManager.enabled && msg.blur_url) ? msg.blur_url : null;

                    // Preload the image
                    loadImage(preloadImage, msg.image_url, function() {
                        preloadComplete = true;
                        sendPreloadReady();
                        // If switch was requested while image was still loading, perform it now
                        if (switchPending) {
                            switchPending = false;
                            performSwitch();
                        }
                    }, function() {
                        // Image failed after retries - don't switch to broken image.
                        // Server will send ASSIGN with replacement via IMAGE_LOAD_FAILED handler.
                        console.log('Preload failed, keeping current image visible');
                        switchPending = false;
                    });
                }

                function handleSwitch(msg) {
                    console.log('Switch command, cycle:', msg.cycle);

                    // Calculate precise switch timing
                    const now = Date.now();
                    const switchDelay = nextSwitchTime ? Math.max(0, nextSwitchTime - now) : 0;

                    // Clear any existing switch timer (#20)
                    if (timers.switch) {
                        clearTimeout(timers.switch);
                        timers.switch = null;
                    }
                    if (timers.switchAnimation) {
                        clearTimeout(timers.switchAnimation);
                        timers.switchAnimation = null;
                    }

                    // Schedule the switch at the exact time
                    if (switchDelay > 0) {
                        timers.switch = setTimeout(performSwitch, switchDelay);
                    } else {
                        performSwitch();
                    }
                }

                function performSwitch() {
                    timers.switch = null; // Clear reference

                    // Defer switch if preload image hasn't finished loading
                    if (!preloadComplete) {
                        console.log('Switch deferred: preload image not ready');
                        switchPending = true;
                        return;
                    }

                    // Apply pending blur background before visual switch
                    if (pendingBlurUrl) {
                        blurManager.update(pendingBlurUrl);
                        pendingBlurUrl = null;
                    }

                    // Swap images with smooth transition
                    currentImage.classList.add('fade-transition');
                    preloadImage.classList.add('fade-transition');

                    // Swap visibility
                    currentImage.classList.remove('visible');
                    currentImage.classList.add('hidden');
                    preloadImage.classList.remove('hidden');
                    preloadImage.classList.add('visible');

                    // After transition, swap the elements' roles (#20 - track timer)
                    timers.switchAnimation = setTimeout(function() {
                        timers.switchAnimation = null;

                        // Remove transition classes
                        currentImage.classList.remove('fade-transition');
                        preloadImage.classList.remove('fade-transition');

                        // Swap element references - preload becomes current, current becomes preload
                        const temp = currentImage;
                        currentImage = preloadImage;
                        preloadImage = temp;

                        // Clear handlers on the now-preload element (was current, now hidden)
                        preloadImage.onload = null;
                        preloadImage.onerror = null;

                        // Reset preload tracking for next cycle
                        preloadComplete = false;
                        switchPending = false;

                        // Update debug
                        updateDebug('CurrentImage', currentImage.src.split('/').pop().split('?')[0]);
                        updateDebug('PreloadImage', '-');
                        updateDebug('NextSwitch', '-');

                        // Notify server
                        sendSwitchComplete();
                    }, 350);
                }

                function handleSettingsChanged(msg) {
                    console.log('Settings changed:', msg.settings);

                    // Update overlay managers with new settings
                    if (msg.settings) {
                        clockManager.updateSettings(msg.settings);
                        weatherManager.updateSettings(msg.settings);
                        blurManager.updateSettings(msg.settings);
                        layoutManager.updateSettings(msg.settings);
                        burnInManager.init(msg.settings);
                    }
                }

                function handleDisconnect(msg) {
                    console.log('Disconnect requested:', msg.reason);
                    // Stop reconnection attempts
                    if (timers.reconnect) {
                        clearTimeout(timers.reconnect);
                        timers.reconnect = null;
                    }
                    reconnectAttempts = Infinity; // Prevent further reconnects
                    if (ws) {
                        ws.close();
                    }
                    alert('Disconnected: ' + (msg.reason || 'Group deleted'));
                }

                function handleNoImages(msg) {
                    console.error('No images available:', msg.error);

                    // Remove any existing error div first (prevent duplicates)
                    clearNoImagesError();

                    // Show error message on screen instead of blank screen
                    var errorDiv = document.createElement('div');
                    errorDiv.id = 'no-images-error';
                    errorDiv.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); ' +
                        'background: rgba(0,0,0,0.8); color: #f44336; padding: 40px; border-radius: 12px; ' +
                        'font-size: 24px; text-align: center; max-width: 80%; z-index: 1000;';
                    var errorMsg = msg.error || 'No images configured for this group';
                    errorDiv.innerHTML = '<div style="font-size: 48px; margin-bottom: 20px;">⚠</div>' +
                        '<div style="margin-bottom: 10px;">No Images Available</div>' +
                        '<div style="font-size: 16px; color: #aaa;">' + errorMsg.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
                    document.body.appendChild(errorDiv);
                }

                function clearNoImagesError() {
                    var errorDiv = document.getElementById('no-images-error');
                    if (errorDiv) {
                        errorDiv.remove();
                    }
                }

                // Image loading with exponential backoff (#12, #22)
                function loadImage(imgElement, url, onSuccess, onFailure) {
                    // Clear previous handlers to prevent stacking (#22)
                    imgElement.onload = null;
                    imgElement.onerror = null;

                    imgElement.onload = function() {
                        console.log('Image loaded:', url.split('/').pop());
                        imageRetryCount = 0; // Reset on success
                        if (onSuccess) onSuccess();
                    };

                    imgElement.onerror = function() {
                        imageRetryCount++;
                        console.error('Failed to load image:', url, '(attempt', imageRetryCount + ')');

                        if (imageRetryCount < IMAGE_RETRY_MAX) {
                            // Exponential backoff: 1s, 2s, 4s (#12)
                            const delay = 1000 * Math.pow(2, imageRetryCount - 1);
                            console.log('Retrying in', delay, 'ms');
                            setTimeout(function() {
                                imgElement.src = url + (url.includes('?') ? '&' : '?') + 'retry=' + Date.now();
                            }, delay);
                        } else {
                            console.error('Max retries exceeded for image:', url);
                            // Report failure to server for replacement
                            const pathMatch = url.match(/\/api\/image\/([^?]+)/);
                            if (pathMatch) {
                                send({
                                    type: 'IMAGE_LOAD_FAILED',
                                    image_path: decodeURIComponent(pathMatch[1])
                                });
                            }
                            if (onFailure) onFailure();
                        }
                    };

                    imgElement.src = url;
                }

                // Send messages to server
                function sendReady() {
                    send({ type: 'READY' });
                }

                function sendPreloadReady() {
                    send({ type: 'PRELOAD_READY' });
                }

                function sendSwitchComplete() {
                    send({ type: 'SWITCH_COMPLETE' });
                }

                function send(msg) {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify(msg));
                    }
                }

                // Update next switch countdown (#21 - store timer reference)
                timers.debugUpdate = setInterval(function() {
                    if (nextSwitchTime) {
                        const remaining = Math.max(0, nextSwitchTime - Date.now());
                        if (remaining > 0) {
                            updateDebug('NextSwitch', (remaining / 1000).toFixed(1) + 's');
                        }
                    }
                }, 100);

                // Cleanup on page unload (#21)
                window.addEventListener('beforeunload', function() {
                    clearAllTimers();
                    if (ws) {
                        ws.close();
                    }
                });

                // Start connection
                connect();
            })();
        </script>
    </body>
</html>
