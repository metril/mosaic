<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% if refresh %}
        <meta http-equiv="refresh" content="{{ refresh }}">
        {% else %}
        <meta http-equiv="refresh" content="300">
        {% endif %}
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <title>Screensaver</title>
        <style type="text/css">
            .screensaver-image {
                border: none;
                max-height: 100vh;
                max-width: 100vw;
                height: 100%;
                width: 100%;
                object-fit: contain;
            }
            body {
                margin: 0;
                padding: 0;
                background-color: rgb(0, 0, 0);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
        </style>
    </head>
    <body>
        {% if refresh %}
        <!-- Refresh mode: single image, page auto-reloads -->
        <img class="screensaver-image" src="{{ image_url }}" alt="Screensaver">
        {% else %}
        <!-- Slideshow mode: JavaScript rotation -->
        <img id="rotatingImage" class="screensaver-image" src="" alt="Screensaver">
        <script type="text/javascript">
            var rotatingImages = [{% for url in image_urls %}"{{ url }}"{% if not loop.last %}, {% endif %}{% endfor %}];
            var imageCount = rotatingImages.length;
            var firstTime = true;
            var thisImage = 0;
            var duration = 30; // seconds

            function rotateImage() {
                // Cycle through images sequentially starting with a random image
                // Do not update the image if loading is not yet completed
                var img = document.getElementById('rotatingImage');
                if (img.complete || firstTime) {
                    if (firstTime) {
                        thisImage = Math.floor(Math.random() * imageCount);
                        firstTime = false;
                    } else {
                        thisImage++;
                        if (thisImage >= imageCount) {
                            thisImage = 0;
                        }
                    }
                    img.src = rotatingImages[thisImage];
                }
                setTimeout(rotateImage, duration * 1000);
            }

            // Start rotation
            rotateImage();
        </script>
        {% endif %}
    </body>
</html>
