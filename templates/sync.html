<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <title>Sync - {{ group_id }}</title>
        <style type="text/css">
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background-color: rgb(0, 0, 0);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                overflow: hidden;
            }
            .image-container {
                position: relative;
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .screensaver-image {
                border: none;
                max-height: 100vh;
                max-width: 100vw;
                height: 100%;
                width: 100%;
                object-fit: contain;
                position: absolute;
                top: 0;
                left: 0;
                z-index: 1;
            }
            .hidden {
                opacity: 0;
                pointer-events: none;
            }
            .visible {
                opacity: 1;
            }
            /* Smooth transition for image swaps */
            .fade-transition {
                transition: opacity 0.3s ease-in-out;
            }
            /* Connection status indicator */
            .status-indicator {
                position: fixed;
                top: 10px;
                right: 10px;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background-color: #888;
                z-index: 1000;
                transition: opacity 0.5s ease-out;
            }
            .status-indicator.hidden {
                opacity: 0;
                pointer-events: none;
            }
            .status-indicator.connected {
                background-color: #4caf50;
            }
            .status-indicator.disconnected {
                background-color: #f44336;
            }
            .status-indicator.connecting {
                background-color: #ff9800;
                animation: pulse 1s infinite;
            }
            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
            }
            /* Debug overlay */
            .debug-overlay {
                position: fixed;
                bottom: 10px;
                left: 10px;
                background: rgba(0, 0, 0, 0.8);
                color: #0f0;
                font-family: monospace;
                font-size: 12px;
                padding: 10px;
                border-radius: 5px;
                z-index: 1000;
                max-width: 400px;
                display: none;
            }
            .debug-overlay.visible {
                display: block;
            }

            /* =================================================================
               Background Blur Layer
               ================================================================= */
            .frame--background {
                position: absolute;
                top: -5%;
                left: -5%;
                width: 110%;
                height: 110%;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                z-index: 0;
                transition: background-image 0.5s ease-in-out;
            }
            /* =================================================================
               Layout Styles
               ================================================================= */
            /* Single layout (default) */
            .layout-single {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .frame--layout-single {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }

            /* Split view - side by side */
            .layout-splitview {
                display: flex;
                flex-direction: row;
            }
            .layout-splitview .frame {
                width: 50%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow: hidden;
            }
            .layout-splitview .frame .screensaver-image {
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                position: relative;
            }

            /* Split view landscape - stacked vertically */
            .layout-splitview-landscape {
                display: flex;
                flex-direction: column;
            }
            .layout-splitview-landscape .frame {
                width: 100%;
                height: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow: hidden;
            }
            .layout-splitview-landscape .frame .screensaver-image {
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                position: relative;
            }

            /* Responsive adjustments */
            @media (orientation: portrait) {
                .layout-splitview {
                    flex-direction: column;
                }
                .layout-splitview .frame {
                    width: 100%;
                    height: 50%;
                }
            }
            @media (orientation: landscape) {
                .layout-splitview-landscape {
                    flex-direction: row;
                }
                .layout-splitview-landscape .frame {
                    width: 50%;
                    height: 100%;
                }
            }

            /* =================================================================
               Overlay Styles (Clock & Weather)
               ================================================================= */
            .overlay {
                position: fixed;
                z-index: 100;
                padding: 20px;
                background: rgba(0, 0, 0, 0.4);
                border-radius: 12px;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .overlay.hidden {
                display: none !important;
            }

            /* Position classes */
            .position-bottom-left { bottom: 30px; left: 30px; }
            .position-bottom-right { bottom: 30px; right: 30px; }
            .position-top-left { top: 30px; left: 30px; }
            .position-top-right { top: 30px; right: 30px; }

            /* Clock styles */
            .clock-overlay {
                text-align: left;
            }
            .clock-time {
                font-size: 3rem;
                font-weight: 600;
                color: white;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
                line-height: 1.2;
                font-family: system-ui, -apple-system, sans-serif;
            }
            .clock-date {
                font-size: 1.2rem;
                color: rgba(255, 255, 255, 0.85);
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
                margin-top: 4px;
                font-family: system-ui, -apple-system, sans-serif;
            }

            /* Weather styles */
            .weather-overlay {
                text-align: right;
            }
            .weather-icon {
                font-size: 3rem;
                margin-bottom: 8px;
            }
            .weather-temp {
                font-size: 2.5rem;
                font-weight: 600;
                color: white;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
                font-family: system-ui, -apple-system, sans-serif;
            }
            .weather-condition {
                font-size: 1rem;
                color: rgba(255, 255, 255, 0.85);
                text-transform: capitalize;
                margin-top: 4px;
            }
            .weather-forecast {
                display: flex;
                gap: 16px;
                margin-top: 12px;
                padding-top: 12px;
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                justify-content: flex-end;
            }
            .forecast-day {
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 0.85rem;
                color: rgba(255, 255, 255, 0.8);
            }
            .forecast-day .forecast-icon {
                font-size: 1.5rem;
                margin: 4px 0;
            }

            /* Image fit modes */
            .screensaver-image.fit-cover {
                object-fit: cover;
            }
            .screensaver-image.fit-contain {
                object-fit: contain;
            }

            .debug-overlay dt {
                color: #888;
                float: left;
                clear: left;
                width: 100px;
            }
            .debug-overlay dd {
                margin-left: 110px;
            }
        </style>
    </head>
    <body>
        <div class="status-indicator connecting" id="statusIndicator"></div>

        <div class="image-container layout-{{ settings.layout|default('single') }}" id="imageContainer">
            <!-- Background blur layer -->
            <div class="frame--background hidden" id="backgroundBlur"></div>

            <!-- Frame 1 (primary) -->
            <div class="frame frame--layout-{{ settings.layout|default('single') }}" id="frame1">
                <img id="currentImage" class="screensaver-image visible fit-{{ settings.image_fit|default('contain') }}" src="" alt="Screensaver">
                <img id="preloadImage" class="screensaver-image hidden fit-{{ settings.image_fit|default('contain') }}" src="" alt="Preload">
            </div>

            <!-- Frame 2 (for split views) -->
            <div class="frame frame--layout-{{ settings.layout|default('single') }}" id="frame2" style="display: none;">
                <img id="currentImage2" class="screensaver-image visible fit-{{ settings.image_fit|default('contain') }}" src="" alt="Screensaver 2">
                <img id="preloadImage2" class="screensaver-image hidden fit-{{ settings.image_fit|default('contain') }}" src="" alt="Preload 2">
            </div>
        </div>

        <!-- Clock overlay -->
        <div class="overlay clock-overlay position-{{ settings.clock_position|default('bottom-left') }} hidden" id="clockOverlay">
            <div class="clock-time" id="clockTime"></div>
            <div class="clock-date" id="clockDate"></div>
        </div>

        <!-- Weather overlay -->
        <div class="overlay weather-overlay position-{{ settings.weather_position|default('bottom-right') }} hidden" id="weatherOverlay">
            <div class="weather-icon" id="weatherIcon"></div>
            <div class="weather-temp" id="weatherTemp"></div>
            <div class="weather-condition" id="weatherCondition"></div>
            <div class="weather-forecast" id="weatherForecast"></div>
        </div>

        <div class="debug-overlay" id="debugOverlay">
            <dl>
                <dt>Browser ID:</dt>
                <dd id="debugBrowserId">-</dd>
                <dt>Group:</dt>
                <dd id="debugGroup">{{ group_id }}</dd>
                <dt>Status:</dt>
                <dd id="debugStatus">connecting</dd>
                <dt>Cycle:</dt>
                <dd id="debugCycle">0</dd>
                <dt>Next switch:</dt>
                <dd id="debugNextSwitch">-</dd>
                <dt>Current:</dt>
                <dd id="debugCurrentImage">-</dd>
                <dt>Preload:</dt>
                <dd id="debugPreloadImage">-</dd>
                <dt>Browsers:</dt>
                <dd id="debugBrowserCount">0</dd>
            </dl>
        </div>

        <script type="text/javascript">
            // =================================================================
            // Settings from server (passed via template)
            // =================================================================
            const SETTINGS = {
                show_time: {{ settings.show_time|default(false)|tojson }},
                show_date: {{ settings.show_date|default(false)|tojson }},
                time_format: "{{ settings.time_format|default('24') }}",
                date_format: "{{ settings.date_format|default('%A, %B %d') }}",
                clock_source: "{{ settings.clock_source|default('client') }}",
                clock_position: "{{ settings.clock_position|default('bottom-left') }}",
                show_weather: {{ settings.show_weather|default(false)|tojson }},
                weather_position: "{{ settings.weather_position|default('bottom-right') }}",
                weather_ha_entity: "{{ settings.weather_ha_entity|default('') }}",
                weather_show_forecast: {{ settings.weather_show_forecast|default(false)|tojson }},
                layout: "{{ settings.layout|default('single') }}",
                background_blur: {{ settings.background_blur|default(false)|tojson }},
                background_blur_amount: {{ settings.background_blur_amount|default(50) }},
                image_fit: "{{ settings.image_fit|default('contain') }}"
            };

            // =================================================================
            // Clock Class - Real-time time display with offset-based server sync
            // =================================================================
            class Clock {
                constructor(settings) {
                    this.settings = settings;
                    this.timeEl = document.getElementById('clockTime');
                    this.dateEl = document.getElementById('clockDate');
                    this.overlay = document.getElementById('clockOverlay');
                    this.updateInterval = null;
                    this.syncInterval = null;
                    this.serverOffset = 0; // Offset between server and client time (ms)
                }

                start() {
                    if (!this.settings.show_time && !this.settings.show_date) {
                        this.overlay.classList.add('hidden');
                        return;
                    }

                    this.overlay.classList.remove('hidden');
                    this.overlay.className = 'overlay clock-overlay position-' + this.settings.clock_position;

                    // Initial sync if using server time
                    if (this.settings.clock_source !== 'client') {
                        this.syncWithServer();
                        // Re-sync every 15 seconds
                        this.syncInterval = setInterval(() => this.syncWithServer(), 15000);
                    }

                    // Update display every second for smooth updates
                    this.render();
                    this.updateInterval = setInterval(() => this.render(), 1000);
                }

                async syncWithServer() {
                    try {
                        const clientBefore = Date.now();
                        const response = await fetch('/api/clock?source=' + this.settings.clock_source);
                        const clientAfter = Date.now();
                        const data = await response.json();

                        if (data.datetime) {
                            const serverTime = new Date(data.datetime).getTime();
                            // Account for network latency (use midpoint)
                            const clientMidpoint = (clientBefore + clientAfter) / 2;
                            this.serverOffset = serverTime - clientMidpoint;
                            console.log('Clock synced, offset:', this.serverOffset, 'ms');
                        }
                    } catch (e) {
                        console.error('Failed to sync clock:', e);
                        // Keep using last offset or 0
                    }
                }

                getCurrentTime() {
                    if (this.settings.clock_source === 'client') {
                        return new Date();
                    }
                    // Apply server offset for accurate time
                    return new Date(Date.now() + this.serverOffset);
                }

                render() {
                    const now = this.getCurrentTime();

                    if (this.settings.show_time) {
                        this.timeEl.textContent = this.formatTime(now);
                        this.timeEl.style.display = 'block';
                    } else {
                        this.timeEl.style.display = 'none';
                    }

                    if (this.settings.show_date) {
                        this.dateEl.textContent = this.formatDate(now);
                        this.dateEl.style.display = 'block';
                    } else {
                        this.dateEl.style.display = 'none';
                    }
                }

                formatTime(date) {
                    const options = {
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: this.settings.time_format === '12'
                    };
                    return date.toLocaleTimeString(undefined, options);
                }

                formatDate(date) {
                    // Immich Kiosk token-based date formatting
                    const format = this.settings.date_format || 'DDDD, MMMM DD';

                    const tokens = {
                        'YYYY': date.getFullYear(),
                        'YY': String(date.getFullYear()).slice(-2),
                        'MMMM': date.toLocaleDateString('en-US', { month: 'long' }),
                        'MMM': date.toLocaleDateString('en-US', { month: 'short' }),
                        'MM': String(date.getMonth() + 1).padStart(2, '0'),
                        'M': date.getMonth() + 1,
                        'DDDD': date.toLocaleDateString('en-US', { weekday: 'long' }),
                        'DDD': date.toLocaleDateString('en-US', { weekday: 'short' }),
                        'DD': String(date.getDate()).padStart(2, '0'),
                        'D': date.getDate()
                    };

                    // Replace tokens longest-first to avoid partial matches
                    let result = format;
                    const sortedTokens = Object.keys(tokens).sort((a, b) => b.length - a.length);
                    for (const token of sortedTokens) {
                        result = result.replace(new RegExp(token, 'g'), tokens[token]);
                    }
                    return result;
                }

                stop() {
                    if (this.updateInterval) {
                        clearInterval(this.updateInterval);
                        this.updateInterval = null;
                    }
                    if (this.syncInterval) {
                        clearInterval(this.syncInterval);
                        this.syncInterval = null;
                    }
                }

                updateSettings(newSettings) {
                    this.stop();
                    this.settings = { ...this.settings, ...newSettings };
                    this.start();
                }
            }

            // =================================================================
            // Weather Class - Weather display from Home Assistant
            // =================================================================
            class Weather {
                constructor(settings) {
                    this.settings = settings;
                    this.overlay = document.getElementById('weatherOverlay');
                    this.updateInterval = null;
                }

                start() {
                    if (!this.settings.show_weather || !this.settings.weather_ha_entity) {
                        this.overlay.classList.add('hidden');
                        return;
                    }

                    this.overlay.classList.remove('hidden');
                    this.overlay.className = 'overlay weather-overlay position-' + this.settings.weather_position;

                    // Update immediately
                    this.update();

                    // Update every 10 minutes
                    this.updateInterval = setInterval(() => this.update(), 600000);
                }

                async update() {
                    try {
                        const response = await fetch(
                            '/api/weather?entity_id=' + encodeURIComponent(this.settings.weather_ha_entity)
                        );
                        if (response.ok) {
                            const data = await response.json();
                            this.render(data);
                        } else {
                            console.error('Weather fetch failed:', response.status);
                        }
                    } catch (e) {
                        console.error('Failed to fetch weather:', e);
                    }
                }

                render(data) {
                    document.getElementById('weatherIcon').textContent = this.getWeatherIcon(data.condition);
                    document.getElementById('weatherTemp').textContent =
                        Math.round(data.temperature) + (data.temperature_unit || '°');
                    document.getElementById('weatherCondition').textContent =
                        data.condition ? data.condition.replace(/-/g, ' ') : '';

                    const forecastEl = document.getElementById('weatherForecast');
                    if (this.settings.weather_show_forecast && data.forecast && data.forecast.length > 0) {
                        forecastEl.innerHTML = data.forecast.map(f => {
                            const date = new Date(f.datetime);
                            const dayName = date.toLocaleDateString(undefined, { weekday: 'short' });
                            return '<div class="forecast-day">' +
                                '<span>' + dayName + '</span>' +
                                '<span class="forecast-icon">' + this.getWeatherIcon(f.condition) + '</span>' +
                                '<span>' + Math.round(f.temperature) + '°</span>' +
                            '</div>';
                        }).join('');
                        forecastEl.style.display = 'flex';
                    } else {
                        forecastEl.style.display = 'none';
                    }
                }

                getWeatherIcon(condition) {
                    if (!condition) return '🌡️';
                    const c = condition.toLowerCase();
                    if (c.includes('sunny') || c.includes('clear')) return c.includes('night') ? '🌙' : '☀️';
                    if (c.includes('cloud') || c.includes('overcast')) return c.includes('partly') ? '⛅' : '☁️';
                    if (c.includes('rain') || c.includes('drizzle') || c.includes('shower')) return '🌧️';
                    if (c.includes('snow') || c.includes('sleet') || c.includes('hail')) return '❄️';
                    if (c.includes('thunder') || c.includes('lightning')) return '⚡';
                    if (c.includes('fog') || c.includes('mist') || c.includes('haze')) return '🌫️';
                    if (c.includes('wind')) return '💨';
                    return '🌡️';
                }

                stop() {
                    if (this.updateInterval) {
                        clearInterval(this.updateInterval);
                        this.updateInterval = null;
                    }
                }

                updateSettings(newSettings) {
                    this.stop();
                    this.settings = { ...this.settings, ...newSettings };
                    this.start();
                }
            }

            // =================================================================
            // BackgroundBlur Class - Manages blurred background layer
            // =================================================================
            class BackgroundBlur {
                constructor(settings) {
                    this.settings = settings;
                    this.backgroundEl = document.getElementById('backgroundBlur');
                    this.enabled = settings.background_blur && settings.image_fit !== 'cover';
                }

                update(blurDataUrl) {
                    if (!this.enabled || !blurDataUrl) {
                        this.backgroundEl.classList.add('hidden');
                        return;
                    }

                    this.backgroundEl.style.backgroundImage = 'url(' + blurDataUrl + ')';
                    this.backgroundEl.classList.remove('hidden');
                }

                clear() {
                    this.backgroundEl.classList.add('hidden');
                    this.backgroundEl.style.backgroundImage = '';
                }

                updateSettings(newSettings) {
                    this.settings = { ...this.settings, ...newSettings };
                    this.enabled = this.settings.background_blur && this.settings.image_fit !== 'cover';
                    if (!this.enabled) {
                        this.clear();
                    }
                }
            }

            // =================================================================
            // LayoutManager Class - Manages display layouts
            // =================================================================
            class LayoutManager {
                constructor(settings) {
                    this.settings = settings;
                    this.container = document.getElementById('imageContainer');
                    this.frame1 = document.getElementById('frame1');
                    this.frame2 = document.getElementById('frame2');
                }

                initialize() {
                    const layout = this.settings.layout || 'single';

                    // Set container class
                    this.container.className = 'image-container layout-' + layout;

                    // Set frame classes
                    this.frame1.className = 'frame frame--layout-' + layout;
                    this.frame2.className = 'frame frame--layout-' + layout;

                    // Show/hide second frame based on layout
                    if (layout !== 'single') {
                        this.frame2.style.display = 'flex';
                    } else {
                        this.frame2.style.display = 'none';
                    }
                }

                getFrameCount() {
                    return this.settings.layout === 'single' ? 1 : 2;
                }

                updateSettings(newSettings) {
                    this.settings = { ...this.settings, ...newSettings };
                    this.initialize();
                }
            }

            // =================================================================
            // Initialize overlay features
            // =================================================================
            const clockManager = new Clock(SETTINGS);
            const weatherManager = new Weather(SETTINGS);
            const blurManager = new BackgroundBlur(SETTINGS);
            const layoutManager = new LayoutManager(SETTINGS);

            // Start features on page load
            document.addEventListener('DOMContentLoaded', function() {
                layoutManager.initialize();
                clockManager.start();
                weatherManager.start();
            });

            (function() {
                // Configuration
                const WS_URL = "{{ ws_url }}";
                const HEARTBEAT_INTERVAL = 30000; // 30 seconds
                const RECONNECT_BASE_DELAY = 1000;
                const RECONNECT_MAX_DELAY = 30000;
                const IMAGE_RETRY_MAX = 3; // Max image load retries (#12)

                // Centralized timer tracking (#19-21)
                const timers = {
                    heartbeat: null,
                    reconnect: null,
                    switch: null,
                    switchAnimation: null,
                    debugUpdate: null,
                    statusHide: null
                };

                // State
                let ws = null;
                let browserId = null;
                let currentCycle = 0;
                let reconnectAttempts = 0;
                let debugVisible = false;
                let nextSwitchTime = null;
                let imageRetryCount = 0; // Track retries per image (#12)

                // DOM elements
                const statusIndicator = document.getElementById('statusIndicator');
                let currentImage = document.getElementById('currentImage');
                let preloadImage = document.getElementById('preloadImage');
                const debugOverlay = document.getElementById('debugOverlay');

                // Clear all timers (#19-21)
                function clearAllTimers() {
                    Object.keys(timers).forEach(function(key) {
                        if (timers[key]) {
                            if (key === 'heartbeat' || key === 'debugUpdate') {
                                clearInterval(timers[key]);
                            } else {
                                clearTimeout(timers[key]);
                            }
                            timers[key] = null;
                        }
                    });
                }

                // Debug functions
                function updateDebug(field, value) {
                    const el = document.getElementById('debug' + field);
                    if (el) el.textContent = value;
                }

                function toggleDebug() {
                    debugVisible = !debugVisible;
                    debugOverlay.classList.toggle('visible', debugVisible);
                }

                // Keyboard handler for debug toggle
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'd' || e.key === 'D') {
                        toggleDebug();
                    }
                });

                // Status indicator
                function setStatus(status) {
                    // Clear any pending hide timer
                    if (timers.statusHide) {
                        clearTimeout(timers.statusHide);
                        timers.statusHide = null;
                    }

                    // Show indicator and set status
                    statusIndicator.classList.remove('hidden');
                    statusIndicator.className = 'status-indicator ' + status;
                    updateDebug('Status', status);

                    // Auto-hide after 3 seconds when connected
                    if (status === 'connected') {
                        timers.statusHide = setTimeout(function() {
                            statusIndicator.classList.add('hidden');
                            timers.statusHide = null;
                        }, 3000);
                    }
                }

                // Reset state on reconnect (#29)
                function resetState() {
                    browserId = null;
                    currentCycle = 0;
                    nextSwitchTime = null;
                    imageRetryCount = 0;
                    updateDebug('BrowserId', '-');
                    updateDebug('Cycle', '0');
                    updateDebug('NextSwitch', '-');
                    updateDebug('CurrentImage', '-');
                    updateDebug('PreloadImage', '-');
                }

                // WebSocket connection
                function connect() {
                    // Cancel any pending reconnect (#6, #15)
                    if (timers.reconnect) {
                        clearTimeout(timers.reconnect);
                        timers.reconnect = null;
                    }

                    // Close existing connection if any
                    if (ws && ws.readyState !== WebSocket.CLOSED) {
                        ws.close();
                    }

                    setStatus('connecting');
                    console.log('Connecting to', WS_URL);

                    try {
                        ws = new WebSocket(WS_URL);
                    } catch (e) {
                        console.error('WebSocket creation failed:', e);
                        scheduleReconnect();
                        return;
                    }

                    ws.onopen = function() {
                        console.log('WebSocket connected');
                        setStatus('connected');
                        reconnectAttempts = 0;
                        startHeartbeat();
                    };

                    ws.onclose = function(event) {
                        console.log('WebSocket closed:', event.code, event.reason);
                        setStatus('disconnected');
                        stopHeartbeat();

                        if (event.code === 4004) {
                            // Group not found - don't reconnect
                            alert('Sync group not found. Please create it via /sync/admin first.');
                        } else {
                            scheduleReconnect();
                        }
                    };

                    ws.onerror = function(error) {
                        console.error('WebSocket error:', error);
                    };

                    ws.onmessage = function(event) {
                        try {
                            const msg = JSON.parse(event.data);
                            handleMessage(msg);
                        } catch (e) {
                            console.error('Failed to parse message:', e);
                        }
                    };
                }

                function scheduleReconnect() {
                    // Clear any existing reconnect timer (#6, #15)
                    if (timers.reconnect) {
                        clearTimeout(timers.reconnect);
                    }

                    reconnectAttempts++;
                    const delay = Math.min(
                        RECONNECT_BASE_DELAY * Math.pow(2, reconnectAttempts - 1),
                        RECONNECT_MAX_DELAY
                    );
                    console.log('Reconnecting in', delay, 'ms (attempt', reconnectAttempts + ')');
                    timers.reconnect = setTimeout(connect, delay);
                }

                function startHeartbeat() {
                    stopHeartbeat();
                    timers.heartbeat = setInterval(function() {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'HEARTBEAT' }));
                        }
                    }, HEARTBEAT_INTERVAL);
                }

                function stopHeartbeat() {
                    if (timers.heartbeat) {
                        clearInterval(timers.heartbeat);
                        timers.heartbeat = null;
                    }
                }

                // Message handlers
                function handleMessage(msg) {
                    console.log('Received:', msg.type, msg);

                    switch (msg.type) {
                        case 'WELCOME':
                            handleWelcome(msg);
                            break;
                        case 'ASSIGN':
                            handleAssign(msg);
                            break;
                        case 'PRELOAD':
                            handlePreload(msg);
                            break;
                        case 'SWITCH':
                            handleSwitch(msg);
                            break;
                        case 'SETTINGS_CHANGED':
                            handleSettingsChanged(msg);
                            break;
                        case 'DISCONNECT':
                            handleDisconnect(msg);
                            break;
                    }
                }

                function handleWelcome(msg) {
                    // Reset state on new connection (#29)
                    resetState();
                    browserId = msg.browser_id;
                    updateDebug('BrowserId', browserId);
                    updateDebug('BrowserCount', msg.browser_count);
                    console.log('Joined as browser', browserId);
                }

                function handleAssign(msg) {
                    console.log('Assigned image:', msg.image_id);
                    currentCycle = msg.cycle;
                    imageRetryCount = 0; // Reset retry count for new image
                    updateDebug('Cycle', currentCycle);
                    updateDebug('CurrentImage', msg.image_id);

                    // Apply blur immediately if provided (no fetch needed)
                    if (msg.blur_url && blurManager.enabled) {
                        blurManager.update(msg.blur_url);
                    }

                    // Load image directly
                    loadImage(currentImage, msg.image_url, function() {
                        sendReady();
                    });
                }

                // Store pending blur URL for next image switch
                let pendingBlurUrl = null;

                function handlePreload(msg) {
                    console.log('Preloading:', msg.image_id, 'switch at', msg.switch_at);
                    nextSwitchTime = msg.switch_at;
                    imageRetryCount = 0; // Reset retry count for new image
                    updateDebug('PreloadImage', msg.image_id);

                    // Calculate time until switch
                    const now = Date.now();
                    const timeUntilSwitch = Math.max(0, msg.switch_at - now);
                    updateDebug('NextSwitch', Math.round(timeUntilSwitch / 1000) + 's');

                    // Store blur for switch (already a data URL from server, no fetch needed)
                    pendingBlurUrl = (blurManager.enabled && msg.blur_url) ? msg.blur_url : null;

                    // Preload the image
                    loadImage(preloadImage, msg.image_url, function() {
                        sendPreloadReady();
                    });
                }

                function handleSwitch(msg) {
                    console.log('Switch command, cycle:', msg.cycle);

                    // Calculate precise switch timing
                    const now = Date.now();
                    const switchDelay = nextSwitchTime ? Math.max(0, nextSwitchTime - now) : 0;

                    // Clear any existing switch timer (#20)
                    if (timers.switch) {
                        clearTimeout(timers.switch);
                        timers.switch = null;
                    }
                    if (timers.switchAnimation) {
                        clearTimeout(timers.switchAnimation);
                        timers.switchAnimation = null;
                    }

                    // Schedule the switch at the exact time
                    if (switchDelay > 0) {
                        timers.switch = setTimeout(performSwitch, switchDelay);
                    } else {
                        performSwitch();
                    }
                }

                function performSwitch() {
                    timers.switch = null; // Clear reference

                    // Apply pending blur background before visual switch
                    if (pendingBlurUrl) {
                        blurManager.update(pendingBlurUrl);
                        pendingBlurUrl = null;
                    }

                    // Swap images with smooth transition
                    currentImage.classList.add('fade-transition');
                    preloadImage.classList.add('fade-transition');

                    // Swap visibility
                    currentImage.classList.remove('visible');
                    currentImage.classList.add('hidden');
                    preloadImage.classList.remove('hidden');
                    preloadImage.classList.add('visible');

                    // After transition, swap the elements' roles (#20 - track timer)
                    timers.switchAnimation = setTimeout(function() {
                        timers.switchAnimation = null;

                        // Remove transition classes
                        currentImage.classList.remove('fade-transition');
                        preloadImage.classList.remove('fade-transition');

                        // Swap element references - preload becomes current, current becomes preload
                        const temp = currentImage;
                        currentImage = preloadImage;
                        preloadImage = temp;

                        // Clear handlers on the now-preload element (was current, now hidden)
                        preloadImage.onload = null;
                        preloadImage.onerror = null;

                        // Update debug
                        updateDebug('CurrentImage', currentImage.src.split('/').pop().split('?')[0]);
                        updateDebug('PreloadImage', '-');
                        updateDebug('NextSwitch', '-');

                        // Notify server
                        sendSwitchComplete();
                    }, 350);
                }

                function handleSettingsChanged(msg) {
                    console.log('Settings changed:', msg.settings);

                    // Update overlay managers with new settings
                    if (msg.settings) {
                        clockManager.updateSettings(msg.settings);
                        weatherManager.updateSettings(msg.settings);
                        blurManager.updateSettings(msg.settings);
                        layoutManager.updateSettings(msg.settings);
                    }
                }

                function handleDisconnect(msg) {
                    console.log('Disconnect requested:', msg.reason);
                    // Stop reconnection attempts
                    if (timers.reconnect) {
                        clearTimeout(timers.reconnect);
                        timers.reconnect = null;
                    }
                    reconnectAttempts = Infinity; // Prevent further reconnects
                    if (ws) {
                        ws.close();
                    }
                    alert('Disconnected: ' + (msg.reason || 'Group deleted'));
                }

                // Image loading with exponential backoff (#12, #22)
                function loadImage(imgElement, url, callback) {
                    // Clear previous handlers to prevent stacking (#22)
                    imgElement.onload = null;
                    imgElement.onerror = null;

                    imgElement.onload = function() {
                        console.log('Image loaded:', url.split('/').pop());
                        imageRetryCount = 0; // Reset on success
                        if (callback) callback();
                    };

                    imgElement.onerror = function() {
                        imageRetryCount++;
                        console.error('Failed to load image:', url, '(attempt', imageRetryCount + ')');

                        if (imageRetryCount < IMAGE_RETRY_MAX) {
                            // Exponential backoff: 1s, 2s, 4s (#12)
                            const delay = 1000 * Math.pow(2, imageRetryCount - 1);
                            console.log('Retrying in', delay, 'ms');
                            setTimeout(function() {
                                imgElement.src = url + (url.includes('?') ? '&' : '?') + 'retry=' + Date.now();
                            }, delay);
                        } else {
                            console.error('Max retries exceeded for image:', url);
                            // Callback anyway to not block sync
                            if (callback) callback();
                        }
                    };

                    imgElement.src = url;
                }

                // Send messages to server
                function sendReady() {
                    send({ type: 'READY' });
                }

                function sendPreloadReady() {
                    send({ type: 'PRELOAD_READY' });
                }

                function sendSwitchComplete() {
                    send({ type: 'SWITCH_COMPLETE' });
                }

                function send(msg) {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify(msg));
                    }
                }

                // Update next switch countdown (#21 - store timer reference)
                timers.debugUpdate = setInterval(function() {
                    if (nextSwitchTime) {
                        const remaining = Math.max(0, nextSwitchTime - Date.now());
                        if (remaining > 0) {
                            updateDebug('NextSwitch', (remaining / 1000).toFixed(1) + 's');
                        }
                    }
                }, 100);

                // Cleanup on page unload (#21)
                window.addEventListener('beforeunload', function() {
                    clearAllTimers();
                    if (ws) {
                        ws.close();
                    }
                });

                // Start connection
                connect();
            })();
        </script>
    </body>
</html>
