<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <title>Sync Admin</title>
        <style type="text/css">
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                background-color: #1a1a2e;
                color: #eee;
                padding: 20px;
                min-height: 100vh;
            }
            h1 {
                margin-bottom: 20px;
                color: #fff;
            }
            h2 {
                margin: 20px 0 10px;
                color: #aaa;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
            }
            /* Groups list */
            .groups-list {
                display: grid;
                gap: 15px;
                margin-bottom: 30px;
            }
            .group-card {
                background: #16213e;
                border-radius: 8px;
                padding: 20px;
                border: 1px solid #0f3460;
            }
            .group-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
            }
            .group-id {
                font-size: 20px;
                font-weight: bold;
                color: #e94560;
            }
            .group-stats {
                display: flex;
                gap: 20px;
                color: #888;
                font-size: 14px;
            }
            .stat {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .stat-value {
                color: #fff;
                font-weight: bold;
            }
            .group-settings {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                margin: 15px 0;
                padding: 15px;
                background: rgba(0, 0, 0, 0.2);
                border-radius: 5px;
            }
            .setting {
                font-size: 13px;
            }
            .setting-label {
                color: #666;
            }
            .setting-value {
                color: #4caf50;
            }
            .group-actions {
                display: flex;
                gap: 10px;
                margin-top: 15px;
            }
            .group-link {
                color: #4caf50;
                text-decoration: none;
                font-size: 13px;
            }
            .group-link:hover {
                text-decoration: underline;
            }
            /* Buttons */
            button {
                padding: 8px 16px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 14px;
                transition: background 0.2s;
            }
            .btn-primary {
                background: #e94560;
                color: white;
            }
            .btn-primary:hover {
                background: #c73e54;
            }
            .btn-secondary {
                background: #0f3460;
                color: #eee;
            }
            .btn-secondary:hover {
                background: #1a4a7a;
            }
            .btn-danger {
                background: #b71c1c;
                color: white;
            }
            .btn-danger:hover {
                background: #8b1515;
            }
            .btn-small {
                padding: 5px 10px;
                font-size: 12px;
            }
            /* Create form */
            .create-form {
                background: #16213e;
                border-radius: 8px;
                padding: 20px;
                border: 1px solid #0f3460;
            }
            .form-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
            .form-group {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            .form-group.full-width {
                grid-column: 1 / -1;
            }
            label {
                font-size: 13px;
                color: #888;
            }
            input, select {
                padding: 8px 12px;
                border: 1px solid #0f3460;
                border-radius: 5px;
                background: #1a1a2e;
                color: #eee;
                font-size: 14px;
            }
            input:focus, select:focus {
                outline: none;
                border-color: #e94560;
            }
            input[type="checkbox"] {
                width: 18px;
                height: 18px;
            }
            .checkbox-group {
                display: flex;
                align-items: center;
                gap: 10px;
                padding-top: 20px;
            }
            .form-actions {
                margin-top: 20px;
                display: flex;
                gap: 10px;
            }
            /* Edit modal */
            .modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }
            .modal.visible {
                display: flex;
            }
            .modal-content {
                background: #16213e;
                border-radius: 8px;
                padding: 20px;
                max-width: 600px;
                width: 90%;
                max-height: 80vh;
                overflow-y: auto;
            }
            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
            }
            .modal-title {
                font-size: 18px;
                color: #fff;
            }
            .modal-close {
                background: none;
                border: none;
                color: #888;
                font-size: 24px;
                cursor: pointer;
            }
            /* Messages */
            .message {
                padding: 10px 15px;
                border-radius: 5px;
                margin-bottom: 15px;
            }
            .message.success {
                background: rgba(76, 175, 80, 0.2);
                border: 1px solid #4caf50;
                color: #4caf50;
            }
            .message.error {
                background: rgba(244, 67, 54, 0.2);
                border: 1px solid #f44336;
                color: #f44336;
            }
            /* Empty state */
            .empty-state {
                text-align: center;
                padding: 40px;
                color: #666;
            }
            /* Loading */
            .loading {
                text-align: center;
                padding: 20px;
                color: #888;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Sync Group Admin</h1>

            <div id="message"></div>

            <h2>Active Groups</h2>
            <div id="groupsList" class="groups-list">
                <div class="loading">Loading...</div>
            </div>

            <h2>Create New Group</h2>
            <div class="create-form">
                <form id="createForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="group_id">Group ID *</label>
                            <input type="text" id="group_id" name="group_id" required
                                   placeholder="e.g., living-room" pattern="[a-zA-Z0-9_-]+"
                                   title="Letters, numbers, dashes, underscores only">
                        </div>
                        <div class="form-group">
                            <label for="duration">Duration (seconds)</label>
                            <input type="number" id="duration" name="duration" value="30" min="5" max="3600">
                        </div>
                        <div class="form-group">
                            <label for="folders">Folders (comma-separated)</label>
                            <input type="text" id="folders" name="folders" placeholder="e.g., earth,space">
                        </div>
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="recursive" name="recursive">
                            <label for="recursive">Recursive search</label>
                        </div>
                        <div class="form-group">
                            <label for="width">Width (px)</label>
                            <input type="number" id="width" name="width" placeholder="Auto" min="1" max="8192">
                        </div>
                        <div class="form-group">
                            <label for="height">Height (px)</label>
                            <input type="number" id="height" name="height" placeholder="Auto" min="1" max="8192">
                        </div>
                        <div class="form-group">
                            <label for="mode">Resize Mode</label>
                            <select id="mode" name="mode">
                                <option value="fit">Fit (letterbox)</option>
                                <option value="crop">Crop (fill)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pad_color">Padding Color</label>
                            <input type="text" id="pad_color" name="pad_color" value="black" placeholder="black">
                        </div>
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="eink" name="eink">
                            <label for="eink">E-Ink mode</label>
                        </div>
                        <div class="form-group">
                            <label for="format">Output Format</label>
                            <select id="format" name="format">
                                <option value="">Auto</option>
                                <option value="jpeg">JPEG</option>
                                <option value="png">PNG</option>
                                <option value="webp">WebP</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="saturation">E-Ink Saturation</label>
                            <input type="number" id="saturation" name="saturation" value="2.5" min="0" max="10" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="contrast">E-Ink Contrast</label>
                            <input type="number" id="contrast" name="contrast" value="1.2" min="0" max="5" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="brightness">E-Ink Brightness</label>
                            <input type="number" id="brightness" name="brightness" value="1.1" min="0" max="5" step="0.1">
                        </div>
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="sharpen" name="sharpen" checked>
                            <label for="sharpen">E-Ink Sharpen</label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Create Group</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="modal-title">Edit Group: <span id="editGroupId"></span></span>
                    <button class="modal-close" onclick="closeEditModal()">&times;</button>
                </div>
                <form id="editForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="edit_duration">Duration (seconds)</label>
                            <input type="number" id="edit_duration" name="duration" min="5" max="3600">
                        </div>
                        <div class="form-group">
                            <label for="edit_folders">Folders</label>
                            <input type="text" id="edit_folders" name="folders">
                        </div>
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="edit_recursive" name="recursive">
                            <label for="edit_recursive">Recursive</label>
                        </div>
                        <div class="form-group">
                            <label for="edit_width">Width</label>
                            <input type="number" id="edit_width" name="width" min="1" max="8192">
                        </div>
                        <div class="form-group">
                            <label for="edit_height">Height</label>
                            <input type="number" id="edit_height" name="height" min="1" max="8192">
                        </div>
                        <div class="form-group">
                            <label for="edit_mode">Mode</label>
                            <select id="edit_mode" name="mode">
                                <option value="fit">Fit</option>
                                <option value="crop">Crop</option>
                            </select>
                        </div>
                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="edit_eink" name="eink">
                            <label for="edit_eink">E-Ink</label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save Changes</button>
                        <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <script type="text/javascript">
            const API_BASE = '/sync/admin/groups';
            let editingGroupId = null;

            // Show message
            function showMessage(text, type) {
                const el = document.getElementById('message');
                el.innerHTML = '<div class="message ' + type + '">' + text + '</div>';
                setTimeout(() => el.innerHTML = '', 5000);
            }

            // Load groups
            async function loadGroups() {
                try {
                    const response = await fetch(API_BASE);
                    const groups = await response.json();
                    renderGroups(groups);
                } catch (e) {
                    document.getElementById('groupsList').innerHTML =
                        '<div class="empty-state">Failed to load groups</div>';
                }
            }

            // Render groups list
            function renderGroups(groups) {
                const container = document.getElementById('groupsList');

                if (!groups || groups.length === 0) {
                    container.innerHTML = '<div class="empty-state">No sync groups. Create one below.</div>';
                    return;
                }

                container.innerHTML = groups.map(group => {
                    const s = group.settings;
                    const syncUrl = window.location.origin + '/sync?sync=' + group.group_id;
                    return `
                        <div class="group-card">
                            <div class="group-header">
                                <span class="group-id">${group.group_id}</span>
                                <div class="group-stats">
                                    <span class="stat">Browsers: <span class="stat-value">${group.browser_count}</span></span>
                                    <span class="stat">Cycle: <span class="stat-value">${group.current_cycle}</span></span>
                                </div>
                            </div>
                            <div class="group-settings">
                                <div class="setting"><span class="setting-label">Duration:</span> <span class="setting-value">${s.duration}s</span></div>
                                <div class="setting"><span class="setting-label">Folders:</span> <span class="setting-value">${s.folders || 'All'}</span></div>
                                <div class="setting"><span class="setting-label">Recursive:</span> <span class="setting-value">${s.recursive ? 'Yes' : 'No'}</span></div>
                                ${s.width ? `<div class="setting"><span class="setting-label">Width:</span> <span class="setting-value">${s.width}px</span></div>` : ''}
                                ${s.height ? `<div class="setting"><span class="setting-label">Height:</span> <span class="setting-value">${s.height}px</span></div>` : ''}
                                <div class="setting"><span class="setting-label">Mode:</span> <span class="setting-value">${s.mode}</span></div>
                                <div class="setting"><span class="setting-label">E-Ink:</span> <span class="setting-value">${s.eink ? 'Yes' : 'No'}</span></div>
                            </div>
                            <a href="${syncUrl}" target="_blank" class="group-link">Open sync display &rarr;</a>
                            <div class="group-actions">
                                <button class="btn-secondary btn-small" onclick="openEditModal('${group.group_id}', ${JSON.stringify(s).replace(/"/g, '&quot;')})">Edit</button>
                                <button class="btn-danger btn-small" onclick="deleteGroup('${group.group_id}')">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Create group
            document.getElementById('createForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const form = e.target;
                const data = {
                    group_id: form.group_id.value,
                    duration: parseInt(form.duration.value) || 30,
                    folders: form.folders.value || null,
                    recursive: form.recursive.checked,
                    width: form.width.value ? parseInt(form.width.value) : null,
                    height: form.height.value ? parseInt(form.height.value) : null,
                    mode: form.mode.value,
                    pad_color: form.pad_color.value || 'black',
                    eink: form.eink.checked,
                    format: form.format.value || null,
                    saturation: parseFloat(form.saturation.value) || 2.5,
                    contrast: parseFloat(form.contrast.value) || 1.2,
                    brightness: parseFloat(form.brightness.value) || 1.1,
                    sharpen: form.sharpen.checked
                };

                try {
                    const response = await fetch(API_BASE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        showMessage('Group created successfully', 'success');
                        form.reset();
                        form.duration.value = 30;
                        form.saturation.value = 2.5;
                        form.contrast.value = 1.2;
                        form.brightness.value = 1.1;
                        form.sharpen.checked = true;
                        loadGroups();
                    } else {
                        const err = await response.json();
                        showMessage(err.detail || 'Failed to create group', 'error');
                    }
                } catch (e) {
                    showMessage('Failed to create group: ' + e.message, 'error');
                }
            });

            // Edit modal
            function openEditModal(groupId, settings) {
                editingGroupId = groupId;
                document.getElementById('editGroupId').textContent = groupId;
                document.getElementById('edit_duration').value = settings.duration;
                document.getElementById('edit_folders').value = settings.folders || '';
                document.getElementById('edit_recursive').checked = settings.recursive;
                document.getElementById('edit_width').value = settings.width || '';
                document.getElementById('edit_height').value = settings.height || '';
                document.getElementById('edit_mode').value = settings.mode;
                document.getElementById('edit_eink').checked = settings.eink;
                document.getElementById('editModal').classList.add('visible');
            }

            function closeEditModal() {
                editingGroupId = null;
                document.getElementById('editModal').classList.remove('visible');
            }

            document.getElementById('editForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!editingGroupId) return;

                const form = e.target;
                const data = {};

                // Only include changed values
                const duration = parseInt(form.duration.value);
                if (!isNaN(duration)) data.duration = duration;

                const folders = form.folders.value;
                if (folders !== '') data.folders = folders;

                data.recursive = form.recursive.checked;

                const width = parseInt(form.width.value);
                if (!isNaN(width)) data.width = width;

                const height = parseInt(form.height.value);
                if (!isNaN(height)) data.height = height;

                data.mode = form.mode.value;
                data.eink = form.eink.checked;

                try {
                    const response = await fetch(API_BASE + '/' + editingGroupId, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        showMessage('Group updated successfully', 'success');
                        closeEditModal();
                        loadGroups();
                    } else {
                        const err = await response.json();
                        showMessage(err.detail || 'Failed to update group', 'error');
                    }
                } catch (e) {
                    showMessage('Failed to update group: ' + e.message, 'error');
                }
            });

            // Delete group
            async function deleteGroup(groupId) {
                if (!confirm('Delete group "' + groupId + '"? All connected browsers will be disconnected.')) {
                    return;
                }

                try {
                    const response = await fetch(API_BASE + '/' + groupId, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        showMessage('Group deleted', 'success');
                        loadGroups();
                    } else {
                        const err = await response.json();
                        showMessage(err.detail || 'Failed to delete group', 'error');
                    }
                } catch (e) {
                    showMessage('Failed to delete group: ' + e.message, 'error');
                }
            }

            // Close modal on outside click
            document.getElementById('editModal').addEventListener('click', (e) => {
                if (e.target.id === 'editModal') {
                    closeEditModal();
                }
            });

            // Auto-refresh groups list
            setInterval(loadGroups, 5000);

            // Initial load
            loadGroups();
        </script>
    </body>
</html>
