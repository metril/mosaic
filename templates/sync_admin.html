<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <title>Sync Admin</title>
        <style type="text/css">
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                background-color: #1a1a2e;
                color: #eee;
                min-height: 100vh;
            }

            /* Header */
            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 24px;
                border-bottom: 1px solid #0f3460;
                background: #16213e;
            }
            .header h1 {
                font-size: 24px;
                font-weight: 600;
            }

            /* Main content */
            .main {
                padding: 24px;
                max-width: 1400px;
                margin: 0 auto;
            }

            /* Section headers */
            .section-header {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 16px;
            }
            .section-title {
                font-size: 14px;
                font-weight: 500;
                color: #888;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .section-count {
                background: #0f3460;
                color: #aaa;
                padding: 2px 8px;
                border-radius: 10px;
                font-size: 12px;
            }

            /* Groups grid */
            .groups-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 16px;
            }

            /* Group card */
            .group-card {
                background: #16213e;
                border: 1px solid #0f3460;
                border-radius: 10px;
                padding: 20px;
                transition: border-color 0.2s;
            }
            .group-card:hover {
                border-color: #1a4a7a;
            }
            .group-name {
                font-size: 18px;
                font-weight: 600;
                color: #e94560;
                margin-bottom: 4px;
            }
            .group-meta {
                font-size: 13px;
                color: #888;
                margin-bottom: 12px;
            }
            .group-summary {
                font-size: 13px;
                color: #aaa;
                padding: 10px 12px;
                background: rgba(0, 0, 0, 0.2);
                border-radius: 6px;
                margin-bottom: 16px;
                line-height: 1.5;
            }
            .group-actions {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }

            /* Playback controls */
            .group-controls {
                display: flex;
                gap: 8px;
                margin-bottom: 12px;
            }
            .btn-control {
                width: 36px;
                height: 36px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                background: #0f3460;
                color: #eee;
                border: 1px solid #1a4a7a;
                border-radius: 6px;
                cursor: pointer;
                transition: all 0.2s;
            }
            .btn-control:hover {
                background: #1a4a7a;
            }
            .btn-control:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            .btn-control.playing {
                background: #4caf50;
                border-color: #4caf50;
            }
            .btn-control.paused {
                background: #ff9800;
                border-color: #ff9800;
            }

            /* Buttons */
            .btn {
                padding: 8px 14px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
                font-weight: 500;
                transition: all 0.2s;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
            .btn-primary {
                background: #e94560;
                color: white;
            }
            .btn-primary:hover {
                background: #d13a54;
            }
            .btn-secondary {
                background: #0f3460;
                color: #eee;
            }
            .btn-secondary:hover {
                background: #1a4a7a;
            }
            .btn-ghost {
                background: transparent;
                color: #888;
                border: 1px solid #0f3460;
            }
            .btn-ghost:hover {
                background: rgba(255, 255, 255, 0.05);
                color: #eee;
            }
            .btn-danger {
                background: transparent;
                color: #e94560;
                border: 1px solid #e94560;
            }
            .btn-danger:hover {
                background: #e94560;
                color: white;
            }
            .btn-link {
                background: none;
                color: #4caf50;
                padding: 8px 0;
            }
            .btn-link:hover {
                text-decoration: underline;
            }

            /* Empty state */
            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: #666;
            }
            .empty-state-icon {
                font-size: 48px;
                margin-bottom: 16px;
                opacity: 0.5;
            }
            .empty-state p {
                margin-bottom: 20px;
            }

            /* Messages */
            .message {
                padding: 12px 16px;
                border-radius: 8px;
                margin-bottom: 20px;
                font-size: 14px;
            }
            .message.success {
                background: rgba(76, 175, 80, 0.15);
                border: 1px solid rgba(76, 175, 80, 0.3);
                color: #4caf50;
            }
            .message.error {
                background: rgba(244, 67, 54, 0.15);
                border: 1px solid rgba(244, 67, 54, 0.3);
                color: #f44336;
            }

            /* Panel overlay */
            .panel-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.3s ease;
                z-index: 999;
            }
            .panel-overlay.visible {
                opacity: 1;
                visibility: visible;
            }

            /* Slide-in panel */
            .panel {
                position: fixed;
                top: 0;
                right: 0;
                width: 450px;
                max-width: 100%;
                height: 100%;
                background: #16213e;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.3);
            }
            .panel.open {
                transform: translateX(0);
            }
            .panel-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 24px;
                border-bottom: 1px solid #0f3460;
                flex-shrink: 0;
            }
            .panel-title {
                font-size: 18px;
                font-weight: 600;
            }
            .panel-close {
                background: none;
                border: none;
                color: #888;
                font-size: 24px;
                cursor: pointer;
                padding: 4px;
                line-height: 1;
            }
            .panel-close:hover {
                color: #eee;
            }
            .panel-body {
                flex: 1;
                overflow-y: auto;
                padding: 24px;
            }
            .panel-footer {
                padding: 16px 24px;
                border-top: 1px solid #0f3460;
                display: flex;
                gap: 12px;
                flex-shrink: 0;
            }
            .panel-footer .btn {
                flex: 1;
            }

            /* Form elements */
            .form-row {
                margin-bottom: 20px;
            }
            .form-row label {
                display: block;
                font-size: 13px;
                font-weight: 500;
                color: #999;
                margin-bottom: 8px;
            }
            .form-row input,
            .form-row select {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #0f3460;
                border-radius: 6px;
                background: #1a1a2e;
                color: #eee;
                font-size: 14px;
                transition: border-color 0.2s;
            }
            .form-row input:focus,
            .form-row select:focus {
                outline: none;
                border-color: #e94560;
            }
            .form-row input::placeholder {
                color: #555;
            }
            .form-row-inline {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .form-row small {
                display: block;
                margin-top: 4px;
                color: #666;
                font-size: 12px;
            }

            /* Checkbox styling */
            .checkbox-row {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 16px;
            }
            .checkbox-row input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: #e94560;
            }
            .checkbox-row label {
                margin-bottom: 0;
                cursor: pointer;
            }

            /* Collapsible sections */
            .settings-section {
                border: 1px solid #0f3460;
                border-radius: 8px;
                margin-bottom: 16px;
                overflow: hidden;
            }
            .settings-section summary {
                padding: 14px 16px;
                cursor: pointer;
                font-weight: 500;
                font-size: 14px;
                background: rgba(0, 0, 0, 0.2);
                list-style: none;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .settings-section summary::-webkit-details-marker {
                display: none;
            }
            .settings-section summary::before {
                content: '';
                width: 0;
                height: 0;
                border-left: 5px solid #888;
                border-top: 4px solid transparent;
                border-bottom: 4px solid transparent;
                transition: transform 0.2s;
            }
            .settings-section[open] summary::before {
                transform: rotate(90deg);
            }
            .settings-section summary:hover {
                background: rgba(0, 0, 0, 0.3);
            }
            .section-content {
                padding: 16px;
                background: rgba(0, 0, 0, 0.1);
            }

            /* Loading state */
            .loading {
                text-align: center;
                padding: 40px;
                color: #888;
            }

            /* Input with button */
            .input-with-button {
                display: flex;
                gap: 8px;
            }
            .input-with-button input {
                flex: 1;
            }
            .input-with-button .btn {
                flex-shrink: 0;
            }

            /* Modal */
            .modal {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                display: none;
                justify-content: center;
                align-items: center;
                z-index: 1001;
            }
            .modal.visible {
                display: flex;
            }
            .modal-content {
                background: #16213e;
                border-radius: 10px;
                max-width: 500px;
                width: 90%;
                max-height: 80vh;
                display: flex;
                flex-direction: column;
            }
            .modal-content.modal-lg {
                max-width: 600px;
            }
            .modal-header {
                padding: 16px 20px;
                border-bottom: 1px solid #0f3460;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .modal-header .modal-title {
                font-size: 18px;
                font-weight: 600;
            }
            .modal-close {
                background: none;
                border: none;
                color: #888;
                font-size: 24px;
                cursor: pointer;
                padding: 4px;
                line-height: 1;
            }
            .modal-close:hover {
                color: #eee;
            }
            .modal-body {
                padding: 20px;
                overflow-y: auto;
                flex: 1;
            }
            .modal-footer {
                padding: 16px 20px;
                border-top: 1px solid #0f3460;
                display: flex;
                justify-content: flex-end;
                gap: 12px;
            }

            /* Folder tree */
            .folder-stats {
                padding: 12px;
                background: rgba(0, 0, 0, 0.2);
                border-radius: 6px;
                margin-bottom: 16px;
                font-size: 13px;
                color: #aaa;
            }
            .folder-tree {
                font-size: 14px;
            }
            .folder-item {
                padding: 4px 0;
            }
            .folder-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 8px;
                border-radius: 4px;
                cursor: pointer;
            }
            .folder-row:hover {
                background: rgba(255, 255, 255, 0.05);
            }
            .folder-row input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: #e94560;
            }
            .folder-toggle {
                width: 16px;
                text-align: center;
                color: #888;
                font-size: 10px;
                user-select: none;
            }
            .folder-name {
                flex: 1;
                color: #eee;
            }
            .folder-count {
                color: #666;
                font-size: 12px;
            }
            .folder-children {
                margin-left: 24px;
                border-left: 1px solid #0f3460;
                padding-left: 8px;
            }

            /* History details (collapsible) */
            .history-details {
                margin: 12px 0;
                background: rgba(0, 0, 0, 0.2);
                border-radius: 6px;
            }
            .history-details summary {
                padding: 10px 14px;
                cursor: pointer;
                font-size: 13px;
                color: #aaa;
                user-select: none;
            }
            .history-details summary:hover {
                color: #eee;
            }
            .history-details[open] summary {
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            .history-strip {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 12px;
                overflow-x: auto;
            }
            .thumb {
                width: 100px;
                height: 67px;
                object-fit: cover;
                border-radius: 4px;
                opacity: 0.7;
                cursor: pointer;
                transition: all 0.2s;
                flex-shrink: 0;
            }
            .thumb:hover {
                opacity: 1;
                transform: scale(1.05);
                z-index: 1;
            }
            .thumb.current {
                width: 130px;
                height: 87px;
                opacity: 1;
                border: 3px solid #e94560;
            }
            .thumb.past {
                border: 2px solid #666;
            }
            .thumb.forward {
                border: 2px solid #4caf50;
            }

            /* Responsive */
            @media (max-width: 500px) {
                .panel {
                    width: 100%;
                }
                .header {
                    flex-direction: column;
                    gap: 16px;
                    text-align: center;
                }
            }
        </style>
    </head>
    <body>
        <header class="header">
            <h1>Sync Admin</h1>
            <button class="btn btn-primary" onclick="openPanel('create')">+ Create Group</button>
        </header>

        <main class="main">
            <div id="message"></div>

            <div class="section-header">
                <span class="section-title">Active Groups</span>
                <span class="section-count" id="groupCount">0</span>
            </div>

            <div id="groupsList" class="groups-grid">
                <div class="loading">Loading groups...</div>
            </div>
        </main>

        <!-- Panel overlay -->
        <div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>

        <!-- Slide-in panel -->
        <div class="panel" id="panel">
            <div class="panel-header">
                <span class="panel-title" id="panelTitle">Create Group</span>
                <button class="panel-close" onclick="closePanel()">&times;</button>
            </div>
            <div class="panel-body">
                <form id="groupForm">
                    <!-- Group ID (create only) -->
                    <div class="form-row" id="groupIdRow">
                        <label for="group_id">Group ID</label>
                        <input type="text" id="group_id" name="group_id" required
                               placeholder="e.g., living-room"
                               pattern="[a-zA-Z0-9_-]+"
                               title="Letters, numbers, dashes, underscores only">
                        <small>Used in the sync URL</small>
                    </div>

                    <!-- Basic Settings -->
                    <details class="settings-section" open>
                        <summary>Basic Settings</summary>
                        <div class="section-content">
                            <div class="form-row">
                                <label for="duration">Duration (seconds)</label>
                                <input type="number" id="duration" name="duration" value="30" min="5" max="3600">
                                <small>Time between image switches</small>
                            </div>
                            <div class="form-row">
                                <label for="folders">Folders</label>
                                <div class="input-with-button">
                                    <input type="text" id="folders" name="folders" placeholder="All images">
                                    <button type="button" class="btn btn-secondary" onclick="openFolderBrowser()">Browse</button>
                                </div>
                                <small>Click Browse to select folders, or type comma-separated paths</small>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="recursive" name="recursive">
                                <label for="recursive">Search subfolders recursively</label>
                            </div>
                        </div>
                    </details>

                    <!-- Image Processing -->
                    <details class="settings-section">
                        <summary>Image Processing</summary>
                        <div class="section-content">
                            <div class="form-row-inline">
                                <div class="form-row">
                                    <label for="width">Width (px)</label>
                                    <input type="number" id="width" name="width" placeholder="Auto" min="1" max="8192">
                                </div>
                                <div class="form-row">
                                    <label for="height">Height (px)</label>
                                    <input type="number" id="height" name="height" placeholder="Auto" min="1" max="8192">
                                </div>
                            </div>
                            <div class="form-row">
                                <label for="mode">Resize Mode</label>
                                <select id="mode" name="mode">
                                    <option value="fit">Fit (letterbox)</option>
                                    <option value="crop">Crop (fill)</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label for="pad_color">Padding Color</label>
                                <input type="text" id="pad_color" name="pad_color" value="black" placeholder="black">
                                <small>Color for letterbox padding (fit mode)</small>
                            </div>
                            <div class="form-row">
                                <label for="format">Output Format</label>
                                <select id="format" name="format">
                                    <option value="">Auto (original format)</option>
                                    <option value="jpeg">JPEG</option>
                                    <option value="png">PNG</option>
                                    <option value="webp">WebP</option>
                                </select>
                            </div>
                        </div>
                    </details>

                    <!-- E-Ink Settings -->
                    <details class="settings-section">
                        <summary>E-Ink Settings</summary>
                        <div class="section-content">
                            <div class="checkbox-row">
                                <input type="checkbox" id="eink" name="eink">
                                <label for="eink">Enable E-Ink mode (Spectra-6 dithering)</label>
                            </div>
                            <div class="form-row-inline">
                                <div class="form-row">
                                    <label for="saturation">Saturation</label>
                                    <input type="number" id="saturation" name="saturation" value="2.5" min="0" max="10" step="0.1">
                                </div>
                                <div class="form-row">
                                    <label for="contrast">Contrast</label>
                                    <input type="number" id="contrast" name="contrast" value="1.2" min="0" max="5" step="0.1">
                                </div>
                            </div>
                            <div class="form-row-inline">
                                <div class="form-row">
                                    <label for="brightness">Brightness</label>
                                    <input type="number" id="brightness" name="brightness" value="1.1" min="0" max="5" step="0.1">
                                </div>
                                <div class="form-row">
                                    <label>&nbsp;</label>
                                    <div class="checkbox-row" style="margin-top: 8px;">
                                        <input type="checkbox" id="sharpen" name="sharpen" checked>
                                        <label for="sharpen">Sharpen</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </details>
                </form>
            </div>
            <div class="panel-footer">
                <button type="button" class="btn btn-ghost" onclick="closePanel()">Cancel</button>
                <button type="submit" form="groupForm" class="btn btn-primary" id="submitBtn">Create Group</button>
            </div>
        </div>

        <!-- Folder browser modal -->
        <div class="modal" id="folderModal">
            <div class="modal-content modal-lg">
                <div class="modal-header">
                    <span class="modal-title">Select Folders</span>
                    <button class="modal-close" onclick="closeFolderModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="folder-stats" id="folderStats">Loading...</div>
                    <div class="folder-tree" id="folderTree"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="closeFolderModal()">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="applyFolderSelection()">Apply Selection</button>
                </div>
            </div>
        </div>

        <script type="text/javascript">
            const API_BASE = '/sync/admin/groups';
            const CSRF_TOKEN = '{{ csrf_token }}';
            let editingGroupId = null;
            let groupSettingsCache = {};
            let folderTreeData = null;
            let selectedFolders = new Set();

            // Show message
            function showMessage(text, type) {
                const el = document.getElementById('message');
                el.innerHTML = '<div class="message ' + type + '">' + escapeHtml(text) + '</div>';
                setTimeout(() => el.innerHTML = '', 5000);
            }

            // Escape HTML to prevent XSS
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Panel management
            function openPanel(mode, groupId) {
                editingGroupId = mode === 'edit' ? groupId : null;
                const panel = document.getElementById('panel');
                const overlay = document.getElementById('panelOverlay');
                const title = document.getElementById('panelTitle');
                const submitBtn = document.getElementById('submitBtn');
                const groupIdRow = document.getElementById('groupIdRow');

                if (mode === 'edit') {
                    title.textContent = 'Edit: ' + groupId;
                    submitBtn.textContent = 'Save Changes';
                    groupIdRow.style.display = 'none';
                    populateForm(groupSettingsCache[groupId]);
                } else {
                    title.textContent = 'Create Group';
                    submitBtn.textContent = 'Create Group';
                    groupIdRow.style.display = 'block';
                    resetForm();
                }

                panel.classList.add('open');
                overlay.classList.add('visible');
                document.body.style.overflow = 'hidden';
            }

            function closePanel() {
                document.getElementById('panel').classList.remove('open');
                document.getElementById('panelOverlay').classList.remove('visible');
                document.body.style.overflow = '';
                editingGroupId = null;
            }

            // Form management
            function resetForm() {
                const form = document.getElementById('groupForm');
                form.reset();
                document.getElementById('duration').value = 30;
                document.getElementById('pad_color').value = 'black';
                document.getElementById('saturation').value = 2.5;
                document.getElementById('contrast').value = 1.2;
                document.getElementById('brightness').value = 1.1;
                document.getElementById('sharpen').checked = true;
            }

            function populateForm(settings) {
                if (!settings) return;
                document.getElementById('duration').value = settings.duration || 30;
                document.getElementById('folders').value = settings.folders || '';
                document.getElementById('recursive').checked = settings.recursive || false;
                document.getElementById('width').value = settings.width || '';
                document.getElementById('height').value = settings.height || '';
                document.getElementById('mode').value = settings.mode || 'fit';
                document.getElementById('pad_color').value = settings.pad_color || 'black';
                document.getElementById('format').value = settings.format || '';
                document.getElementById('eink').checked = settings.eink || false;
                document.getElementById('saturation').value = settings.saturation ?? 2.5;
                document.getElementById('contrast').value = settings.contrast ?? 1.2;
                document.getElementById('brightness').value = settings.brightness ?? 1.1;
                document.getElementById('sharpen').checked = settings.sharpen ?? true;
            }

            function getFormData() {
                const form = document.getElementById('groupForm');
                const data = {};

                if (!editingGroupId) {
                    data.group_id = form.group_id.value;
                }

                const duration = parseInt(form.duration.value);
                if (!isNaN(duration)) data.duration = duration;

                const folders = form.folders.value.trim();
                data.folders = folders || null;
                data.recursive = form.recursive.checked;

                const width = parseInt(form.width.value);
                const height = parseInt(form.height.value);
                if (!isNaN(width)) data.width = width;
                if (!isNaN(height)) data.height = height;

                data.mode = form.mode.value;
                data.pad_color = form.pad_color.value || 'black';
                data.format = form.format.value || null;
                data.eink = form.eink.checked;
                data.saturation = parseFloat(form.saturation.value) || 2.5;
                data.contrast = parseFloat(form.contrast.value) || 1.2;
                data.brightness = parseFloat(form.brightness.value) || 1.1;
                data.sharpen = form.sharpen.checked;

                return data;
            }

            // Form submission
            document.getElementById('groupForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = getFormData();

                try {
                    const url = editingGroupId ? API_BASE + '/' + editingGroupId : API_BASE;
                    const method = editingGroupId ? 'PATCH' : 'POST';

                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-Token': CSRF_TOKEN
                        },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        showMessage(editingGroupId ? 'Group updated' : 'Group created', 'success');
                        closePanel();
                        loadGroups();
                    } else {
                        const err = await response.json();
                        showMessage(err.detail || 'Operation failed', 'error');
                    }
                } catch (e) {
                    showMessage('Request failed: ' + e.message, 'error');
                }
            });

            // Track open history details panels
            let openHistoryPanels = new Set();

            // Load groups
            async function loadGroups() {
                // Save open history panels before refresh
                document.querySelectorAll('.history-details[open]').forEach(d => {
                    const groupId = d.dataset.groupId;
                    if (groupId) openHistoryPanels.add(groupId);
                });
                // Also remove closed panels from the set
                document.querySelectorAll('.history-details:not([open])').forEach(d => {
                    const groupId = d.dataset.groupId;
                    if (groupId) openHistoryPanels.delete(groupId);
                });

                try {
                    const response = await fetch(API_BASE);
                    if (!response.ok) {
                        throw new Error('Server returned ' + response.status);
                    }
                    const groups = await response.json();
                    renderGroups(groups);

                    // Restore open history panels after render
                    openHistoryPanels.forEach(groupId => {
                        const details = document.querySelector(`.history-details[data-group-id="${groupId}"]`);
                        if (details) details.open = true;
                    });
                } catch (e) {
                    document.getElementById('groupsList').innerHTML =
                        '<div class="empty-state"><p>Failed to load groups</p><p style="color:#666">' + escapeHtml(e.message) + '</p></div>';
                }
            }

            // Render groups
            function renderGroups(groups) {
                const container = document.getElementById('groupsList');
                const countEl = document.getElementById('groupCount');
                groupSettingsCache = {};

                countEl.textContent = groups.length;

                if (!groups || groups.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">&#128247;</div>
                            <p>No sync groups yet</p>
                            <button class="btn btn-primary" onclick="openPanel('create')">Create your first group</button>
                        </div>
                    `;
                    return;
                }

                groups.forEach(group => {
                    groupSettingsCache[group.group_id] = group.settings;
                });

                container.innerHTML = groups.map(group => {
                    const s = group.settings;
                    const groupIdSafe = escapeHtml(group.group_id);
                    const syncUrl = window.location.origin + '/sync?sync=' + encodeURIComponent(group.group_id);
                    const isPaused = group.paused;

                    // Build summary line
                    const summaryParts = [s.duration + 's', s.mode];
                    if (s.width && s.height) {
                        summaryParts.push(s.width + '×' + s.height);
                    } else if (s.width) {
                        summaryParts.push(s.width + 'w');
                    } else if (s.height) {
                        summaryParts.push(s.height + 'h');
                    }
                    if (s.eink) summaryParts.push('E-Ink');
                    if (s.folders) summaryParts.push('📁 ' + escapeHtml(s.folders));

                    // Status indicator
                    const statusText = isPaused ? ' (Paused)' : '';

                    // Build history strip for each browser
                    const browserHistoryHtml = group.browsers.map(browser => {
                        const historyCount = browser.history_count || 0;
                        const forwardCount = browser.forward_count || 0;
                        const totalSeen = historyCount + 1 + forwardCount;
                        const currentPos = historyCount + 1;

                        // Build thumbnail strip
                        let thumbsHtml = '';

                        // Helper to encode path preserving slashes
                        const encodePath = (p) => p.split('/').map(encodeURIComponent).join('/');

                        // Past images (from image_history, oldest to newest)
                        if (browser.image_history && browser.image_history.length > 0) {
                            thumbsHtml += browser.image_history.map(img =>
                                `<img src="/api/image/${encodePath(img)}?width=200&height=133" class="thumb past" alt="Past" loading="lazy">`
                            ).join('');
                        }

                        // Current image
                        if (browser.current_image) {
                            thumbsHtml += `<img src="/api/image/${encodePath(browser.current_image)}?width=260&height=173" class="thumb current" alt="Current" loading="lazy">`;
                        }

                        // Forward images (newest to oldest, so reverse for display)
                        if (browser.forward_history && browser.forward_history.length > 0) {
                            thumbsHtml += browser.forward_history.slice().reverse().map(img =>
                                `<img src="/api/image/${encodePath(img)}?width=200&height=133" class="thumb forward" alt="Forward" loading="lazy">`
                            ).join('');
                        }

                        if (!thumbsHtml) {
                            return '';  // No history section if nothing to show
                        }

                        // Summary for collapsible header
                        const summaryText = forwardCount > 0
                            ? `History (${historyCount} behind, ${forwardCount} ahead)`
                            : historyCount > 0
                                ? `History (${historyCount} behind)`
                                : 'Current image';

                        return `
                            <details class="history-details" data-group-id="${escapeHtml(group.group_id)}">
                                <summary>${summaryText}</summary>
                                <div class="history-strip">${thumbsHtml}</div>
                            </details>
                        `;
                    }).join('');

                    return `
                        <div class="group-card">
                            <div class="group-name">${groupIdSafe}${statusText}</div>
                            <div class="group-meta">${group.browser_count} browser${group.browser_count !== 1 ? 's' : ''} connected &bull; Cycle ${group.current_cycle}</div>
                            <div class="group-controls">
                                <button class="btn-control" data-action="rewind-all" data-group-id="${groupIdSafe}" title="Rewind All">&#9198;</button>
                                <button class="btn-control" data-action="previous" data-group-id="${groupIdSafe}" title="Previous">&#9664;</button>
                                <button class="btn-control ${isPaused ? 'paused' : 'playing'}" data-action="${isPaused ? 'play' : 'pause'}" data-group-id="${groupIdSafe}" title="${isPaused ? 'Play' : 'Pause'}">${isPaused ? '&#9654;' : '&#9208;'}</button>
                                <button class="btn-control" data-action="next" data-group-id="${groupIdSafe}" title="Next">&#9654;</button>
                                <button class="btn-control" data-action="forward-all" data-group-id="${groupIdSafe}" title="Forward All">&#9197;</button>
                            </div>
                            ${browserHistoryHtml}
                            <div class="group-summary">${summaryParts.join(' &bull; ')}</div>
                            <div class="group-actions">
                                <a href="${syncUrl}" target="_blank" class="btn btn-link">Open Display</a>
                                <button class="btn btn-ghost btn-edit" data-group-id="${groupIdSafe}">Edit</button>
                                <button class="btn btn-danger btn-delete" data-group-id="${groupIdSafe}">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Event delegation for buttons
            document.getElementById('groupsList').addEventListener('click', async function(e) {
                const controlBtn = e.target.closest('.btn-control');
                const editBtn = e.target.closest('.btn-edit');
                const deleteBtn = e.target.closest('.btn-delete');

                if (controlBtn) {
                    const action = controlBtn.dataset.action;
                    const groupId = controlBtn.dataset.groupId;
                    await sendControlAction(groupId, action);
                } else if (editBtn) {
                    const groupId = editBtn.dataset.groupId;
                    openPanel('edit', groupId);
                } else if (deleteBtn) {
                    const groupId = deleteBtn.dataset.groupId;
                    deleteGroup(groupId);
                }
            });

            // Send playback control action
            async function sendControlAction(groupId, action) {
                try {
                    const response = await fetch(API_BASE + '/' + groupId + '/' + action, {
                        method: 'POST',
                        headers: {
                            'X-CSRF-Token': CSRF_TOKEN
                        }
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        showMessage(err.detail || 'Action failed', 'error');
                    } else {
                        loadGroups();  // Refresh to show updated state
                    }
                } catch (e) {
                    showMessage('Action failed: ' + e.message, 'error');
                }
            }

            // Delete group
            async function deleteGroup(groupId) {
                if (!confirm('Delete "' + groupId + '"?\n\nAll connected browsers will be disconnected.')) {
                    return;
                }

                try {
                    const response = await fetch(API_BASE + '/' + groupId, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRF-Token': CSRF_TOKEN
                        }
                    });

                    if (response.ok) {
                        showMessage('Group deleted', 'success');
                        loadGroups();
                    } else {
                        const err = await response.json();
                        showMessage(err.detail || 'Failed to delete', 'error');
                    }
                } catch (e) {
                    showMessage('Delete failed: ' + e.message, 'error');
                }
            }

            // Folder browser
            async function openFolderBrowser() {
                document.getElementById('folderModal').classList.add('visible');

                // Parse current selection from input
                const currentFolders = document.getElementById('folders').value;
                selectedFolders = new Set(
                    currentFolders ? currentFolders.split(',').map(f => f.trim()).filter(f => f) : []
                );

                // Fetch folder tree if not cached
                if (!folderTreeData) {
                    document.getElementById('folderTree').innerHTML = '<div class="loading">Loading folders...</div>';
                    try {
                        const response = await fetch('/browse?format=json');
                        if (!response.ok) throw new Error('Failed to load folders');
                        folderTreeData = await response.json();
                    } catch (e) {
                        document.getElementById('folderTree').innerHTML =
                            '<div class="empty-state">Failed to load: ' + escapeHtml(e.message) + '</div>';
                        return;
                    }
                }

                renderFolderTree();
            }

            function renderFolderTree() {
                const stats = document.getElementById('folderStats');
                stats.innerHTML = folderTreeData.total_folders + ' folders &bull; ' + folderTreeData.total_files + ' images';

                const container = document.getElementById('folderTree');
                container.innerHTML = renderFolderNode(folderTreeData.tree, true);
            }

            function renderFolderNode(node, isRoot) {
                if (node.type !== 'folder') return '';

                // Filter to only show folders
                const childFolders = (node.children || []).filter(c => c.type === 'folder');
                const fileCount = (node.children || []).filter(c => c.type === 'file').length;
                const hasChildren = childFolders.length > 0;

                // Skip root folder itself but show its children
                if (isRoot) {
                    if (childFolders.length === 0) {
                        return '<div class="empty-state">No folders found</div>';
                    }
                    return childFolders.map(child => renderFolderNode(child, false)).join('');
                }

                const isChecked = selectedFolders.has(node.path);
                const totalFiles = node.file_count || fileCount;
                const pathAttr = escapeHtml(node.path);

                return '<div class="folder-item">' +
                    '<div class="folder-row">' +
                        (hasChildren ? '<span class="folder-toggle" onclick="toggleFolderExpand(this)">▶</span>' : '<span class="folder-toggle"></span>') +
                        '<input type="checkbox" data-path="' + pathAttr + '" ' + (isChecked ? 'checked' : '') + ' onchange="toggleFolderSelection(this)">' +
                        '<span class="folder-name">' + escapeHtml(node.name) + '</span>' +
                        '<span class="folder-count">' + totalFiles + '</span>' +
                    '</div>' +
                    (hasChildren ? '<div class="folder-children" style="display:none">' + childFolders.map(child => renderFolderNode(child, false)).join('') + '</div>' : '') +
                '</div>';
            }

            function toggleFolderExpand(toggle) {
                const item = toggle.closest('.folder-item');
                const children = item.querySelector('.folder-children');
                if (children) {
                    const isHidden = children.style.display === 'none';
                    children.style.display = isHidden ? 'block' : 'none';
                    toggle.textContent = isHidden ? '▼' : '▶';
                }
            }

            function toggleFolderSelection(checkbox) {
                const path = checkbox.dataset.path;
                if (checkbox.checked) {
                    selectedFolders.add(path);
                } else {
                    selectedFolders.delete(path);
                }
            }

            function applyFolderSelection() {
                const folders = Array.from(selectedFolders).join(',');
                document.getElementById('folders').value = folders;
                closeFolderModal();
            }

            function closeFolderModal() {
                document.getElementById('folderModal').classList.remove('visible');
            }

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeFolderModal();
                    closePanel();
                }
            });

            // Auto-refresh
            setInterval(loadGroups, 5000);

            // Initial load
            loadGroups();
        </script>
    </body>
</html>
